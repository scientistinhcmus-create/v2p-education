    <div class="grid" style="grid-template-columns:1fr 260px;gap:14px;align-items:start">
      <div style="max-height:62vh;overflow:auto;border:1px solid var(--line);text-align:center;background:#f6f7fb"><div id="ctWrap" style="position:relative;display:inline-block;touch-action:none;user-select:none;cursor:crosshair"><img id="ctImg" draggable="false" style="display:block"><div id="ctSel" style="position:absolute;border:2px solid #e3342f;background:rgba(255,185,38,.2);display:none;pointer-events:none"></div></div><div id="ctEmpty" class="empty small" style="padding:30px"></div></div>
      <div>${isSol?'':`<div class="small"><b>Hình đề hiện tại</b></div><div id="ctQPrev" class="prev mt" style="min-height:60px">${q.img?`<img src="${esc(q.img)}" style="max-width:100%">`:'<span class="muted small">Chưa có</span>'}</div>`}
        <div class="small ${isSol?'':'mt'}"><b>Hình lời giải hiện tại</b></div><div id="ctSPrev" class="prev mt" style="min-height:60px">${q.solImg?`<img src="${esc(q.solImg)}" style="max-width:100%">`:'<span class="muted small">Chưa có</span>'}</div>
        <div class="small mt muted" style="max-height:200px;overflow:auto"><b>Lời giải:</b><br>${esc(String(q.solution||'').slice(0,600))}</div></div>
    </div>
    <div class="row end mt">${isSol?'':'<button class="btn ghost sm" id="ctQRm">Bỏ hình đề</button>'}<button class="btn ghost sm" id="ctSRm">Bỏ hình lời giải</button><span style="flex:1"></span>${isSol?'':'<button class="btn ghost" id="ctQ">Gắn vào đề bài</button>'}<button class="btn ${isSol?'':'ghost'}" id="ctS">Gắn vào lời giải</button><button class="btn" id="ctDone">Xong</button></div>`, true);
  const img=$('#ctImg'), wrap=$('#ctWrap'), box=$('#ctSel');
  const draw=()=>{ if(!sel){ box.style.display='none'; return; } const W=img.clientWidth, H=img.clientHeight; const [x1,y1,x2,y2]=sel; box.style.display='block'; box.style.left=(Math.min(x1,x2)/1000*W)+'px'; box.style.top=(Math.min(y1,y2)/1000*H)+'px'; box.style.width=(Math.abs(x2-x1)/1000*W)+'px'; box.style.height=(Math.abs(y2-y1)/1000*H)+'px'; };
  const applyZoom=()=>{ const cw=wrap.parentElement.clientWidth-4; const fit=img.naturalHeight? Math.min(cw, Math.round(window.innerHeight*0.6*img.naturalWidth/img.naturalHeight)) : cw; img.style.maxWidth='none'; img.style.width=Math.max(200, Math.round(fit*zoom))+'px'; $('#ctZv').textContent=Math.round(zoom*100)+'%'; draw(); };
  img.onload=()=>{ applyZoom(); };
  const renderTabs=()=>{
    $('#ctPages').innerHTML = keys.map(k=>`<button class="btn sm ${k===cur?'':'ghost'}" data-k="${k}">${esc(PAGES[k].label)}</button>`).join('');
    $$('#ctPages [data-k]').forEach(b=>b.onclick=()=>{ cur=b.dataset.k; show(); });
    const d=src();
    $('#ctNav').innerHTML = d ? `<button class="btn ghost sm" id="ctPrev">◀</button><span class="small">Trang</span><input type="number" id="ctPn" min="1" max="${d.doc.numPages}" value="${curPage}" style="width:64px"><span class="small">/ ${d.doc.numPages}</span><button class="btn ghost sm" id="ctNext">▶</button>${hint.length?`<span class="small muted">gợi ý: ${hint.map(p=>`<a href="#" data-hp="${p}">tr.${p}</a>`).join(' ')}</span>`:''}` : '';
    if (d){ $('#ctPrev').onclick=()=>gotoPage(curPage-1); $('#ctNext').onclick=()=>gotoPage(curPage+1); $('#ctPn').onchange=()=>gotoPage(+$('#ctPn').value); $$('#ctNav [data-hp]').forEach(a=>a.onclick=(ev)=>{ ev.preventDefault(); gotoPage(+a.dataset.hp); }); }
    const info=$('#ctInfo'); info.textContent = d ? `File: ${d.name}` : (isSol ? 'Chưa mở file hướng dẫn giải trong phiên này — bấm "📂 Mở file lời giải PDF" để chọn lại file, hoặc tải ảnh chụp trang lời giải.' : '');
  };
  const gotoPage=async(n)=>{ const d=src(); if(!d) return; n=Math.max(1,Math.min(d.doc.numPages, n||1)); curPage=n; $('#ctInfo').innerHTML='<span class="spin"></span> Đang hiện trang '+n+'…';
    try{ const k=await pageKey(d.doc, n, (isSol?'Trang HDG ':'Trang đề ')+n); if(!keys.includes(k)) keys.push(k); cur=k; show(); }catch(e){ toast('Không mở được trang '+n); renderTabs(); } };
  const show=()=>{ renderTabs(); sel=null; box.style.display='none';
    if(!cur){ img.style.display='none'; $('#ctEmpty').style.display=''; $('#ctEmpty').textContent= src() ? 'Chọn trang cần cắt.' : 'Chưa có trang nào để cắt.'; return; }
    img.style.display=''; $('#ctEmpty').style.display='none'; img.src=PAGES[cur].url;
    const m=/(\d+)\s*$/.exec(PAGES[cur].label||''); if(m && src()){ curPage=+m[1]; const pn=$('#ctPn'); if(pn) pn.value=curPage; }
    const f = isSol ? q.solFig : q.fig;
    if (f && Array.isArray(f.box) && (q._pages||[])[(+f.img||1)-1]===cur){ sel=f.box.map(Number); if(Math.max(...sel)<=1.001) sel=sel.map(v=>v*1000); setTimeout(draw,50); } };
  let start=null;
  const pt=e=>{ const r=img.getBoundingClientRect(); return [Math.max(0,Math.min(1000,(e.clientX-r.left)/r.width*1000)), Math.max(0,Math.min(1000,(e.clientY-r.top)/r.height*1000))]; };
  wrap.onpointerdown=e=>{ if(!cur) return; e.preventDefault(); start=pt(e); sel=[...start,...start]; try{ wrap.setPointerCapture(e.pointerId); }catch(_){} draw(); };
  wrap.onpointermove=e=>{ if(!start) return; const p=pt(e); sel=[start[0],start[1],p[0],p[1]]; draw(); };
  wrap.onpointerup=()=>{ start=null; };
  $('#ctZi').onclick=()=>{ zoom=Math.min(4, zoom+0.5); applyZoom(); }; $('#ctZo').onclick=()=>{ zoom=Math.max(1, zoom-0.5); applyZoom(); };
  $('#ctPdf').onchange=async()=>{ const f=$('#ctPdf').files[0]; if(!f) return; $('#ctInfo').innerHTML='<span class="spin"></span> Đang mở file…';
    try{ const doc=await openPdf(f); const o={doc, name:f.name}; if(isSol) ASTATE.solDoc=o; else ASTATE.pdfDoc=o; await gotoPage(hint[0]||1); }catch(e){ toast('Không đọc được file PDF'); renderTabs(); } };
  $('#ctPic').onchange=async()=>{ const f=$('#ctPic').files[0]; if(!f) return; try{ const url=await fileToDataURL(f,1600); const k=addPage(url, (isSol?'Trang HDG ':'Trang đề ')+'(ảnh '+f.name.slice(0,18)+')'); keys.push(k); cur=k; show(); }catch(e){ toast('Không đọc được ảnh'); } };
  const doCrop=async(kind)=>{ if(!cur||!sel || Math.abs(sel[2]-sel[0])<8 || Math.abs(sel[3]-sel[1])<8){ toast('Hãy kéo để khoanh vùng hình trước'); return; }
    const url=await cropFig(cur, sel, 800, 0); if(!url){ toast('Vùng chọn quá nhỏ'); return; }
    if (!(q._pages||[]).includes(cur)) q._pages=(q._pages||[]).concat(cur);
    const fb={img:q._pages.indexOf(cur)+1, box:sel.slice()};
    if (kind==='q'){ q.img=url; q.fig=fb; $('#ctQPrev').innerHTML=`<img src="${url}" style="max-width:100%">`; } else { q.solImg=url; q.solFig=fb; $('#ctSPrev').innerHTML=`<img src="${url}" style="max-width:100%">`; }
    toast(kind==='q'?'Đã gắn hình vào đề bài':'Đã gắn hình vào lời giải'); };
  if ($('#ctQ')) $('#ctQ').onclick=()=>doCrop('q'); $('#ctS').onclick=()=>doCrop('s');
  if ($('#ctQRm')) $('#ctQRm').onclick=()=>{ delete q.img; delete q.fig; $('#ctQPrev').innerHTML='<span class="muted small">Chưa có</span>'; };
  $('#ctSRm').onclick=()=>{ delete q.solImg; delete q.solFig; $('#ctSPrev').innerHTML='<span class="muted small">Chưa có</span>'; };
  const finish=()=>{ closeModal(); onDone && onDone(q); };
  $('#ctDone').onclick=finish; $('#ctClose').onclick=finish;
  if (!cur && src()) gotoPage(hint[0]||1); else show();
}

function exportDrafts(){
  const pick=(S.aiDrafts||[]).filter(d=>d.on).map(d=>{ const o=cleanQ(d.q); o.src='ai'; return o; });
  if (!pick.length){ toast('Chưa chọn câu nào'); return; }
  const bad=pick.filter(q=>validateQ(q)).length;
  const data=JSON.stringify(pick);
  const nImg=pick.filter(q=>q.img||q.solImg).length; const nCh=pick.filter(q=>q.kho==='chuan').length;
  openModal(`<h2>Xuất ${pick.length} câu hỏi <span class="small muted">(⭐ Kho đề chuẩn: ${nCh} · Kho ôn tập: ${pick.length-nCh})</span></h2>${bad?`<div class="banner">Có ${bad} câu còn thiếu thông tin — trang V2P sẽ báo lỗi khi nhập. Hãy sửa hoặc bỏ chọn.</div>`:''}
    <p class="small">Bấm <b>Sao chép</b>, mở trang <b>V2P Education → Ngân hàng câu hỏi → Nhập JSON</b> rồi dán vào và bấm Nhập. Câu nào được đánh dấu ⭐ sẽ tự vào <b>Kho đề chuẩn</b> (giữ lựa chọn mặc định "Theo đánh dấu trong file").${nImg?` Có ${nImg} câu kèm hình vẽ (đã nằm sẵn trong dữ liệu).`:''}</p>
    <textarea id="expTa" style="min-height:220px;font-family:monospace;font-size:12px" readonly>${esc(data.length>200000?data.slice(0,2000)+'\n… (dữ liệu dài, hãy dùng nút Sao chép)':data)}</textarea>
    <div class="row end mt"><button class="btn ghost" id="expDone">Đã nhập xong — xóa các câu này khỏi xưởng</button><button class="btn" id="cpExp">Sao chép</button></div>`, true);
  $('#cpExp').onclick=async()=>{ try{ await navigator.clipboard.writeText(data); toast('Đã sao chép JSON'); }catch(e){ const t=$('#expTa'); t.value=data; t.focus(); t.select(); toast('Nhấn Ctrl+C để sao chép'); } };
  $('#expDone').onclick=()=>{ S.aiDrafts=(S.aiDrafts||[]).filter(d=>!d.on); closeModal(); renderDrafts(); };
}
function renderDrafts(){
  const out=$('#aiOut'); if(!out) return;
  if (ASTATE.tab==='bp') return;

  const on=D.filter(d=>d.on).length;
  out.innerHTML=`<div class="row between mb"><h2 style="margin:0">Duyệt ${D.length} câu do AI soạn</h2><div class="row"><span class="small"><b>Đưa các câu đã chọn vào:</b></span><button class="btn acc sm" id="dAllCh">⭐ Kho đề chuẩn</button><button class="btn ghost sm" id="dAllOn">Kho ôn tập</button><span class="sep"></span><button class="btn ghost sm" id="dClear">Bỏ tất cả</button><button class="btn" id="dSave">${MODE==='workshop'?`Xuất JSON ${on} câu đã chọn`:`Lưu ${on} câu đã chọn vào ngân hàng`}</button></div></div>
  <div class="banner">⚠️ AI có thể nhầm đáp án hoặc cắt hình chưa chuẩn. Thầy/cô kiểm tra lời giải, bấm <b>Sửa</b> hoặc <b>✂️ Cắt hình</b> nếu cần trước khi lưu. Câu bị bỏ chọn sẽ không được lưu.</div>
  <div id="dMsg" class="small mb"></div>
  ${D.map((d,i)=>{ const err=validateQ(cleanQ(d.q)); const canCrop=(d.q._pages||[]).some(k=>PAGES[k]); const figNeed=(d.q.fig&&!d.q.img)||(d.q.solFig&&!d.q.solImg);
    return `<div class="ai-card ${d.on?'':'off'}"><div class="qhead"><label class="row" style="gap:6px;cursor:pointer"><input type="checkbox" data-on="${i}" ${d.on?'checked':''}> <b>Câu ${i+1}</b></label><span class="chip pri">${TYPE_SHORT[d.q.type]||d.q.type}</span><span class="chip">Lớp ${d.q.grade}</span><span class="chip">${esc(topicName(d.q.topic))}</span><span class="chip">${LEVELS[d.q.level]||d.q.level}</span><button class="btn ${qKho(d.q)==='chuan'?'acc':'ghost'} sm" data-dstar="${i}" title="Bấm để đổi kho">${qKho(d.q)==='chuan'?'⭐ Kho đề chuẩn':'☆ Kho ôn tập'}</button>${d.q.solSrc==='hdg'?'<span class="chip good" title="Lời giải chép theo hướng dẫn giải trong tài liệu">📗 Lời giải theo HDG</span>':d.q.solSrc==='ai'?'<span class="chip warn" title="Tài liệu không có lời giải cho câu này — AI tự soạn, thầy/cô nên đọc lại">🤖 AI tự giải</span>':''}${d.q.warn?`<span class="chip bad" title="${esc(d.q.warn)}">⚠ ${esc(String(d.q.warn).slice(0,60))}</span>`:''}${d.q.srcNote?`<span class="chip warn">PDF ${esc(d.q.srcNote)}</span>`:''}${d.q.img||d.q.solImg?'<span class="chip good">🖼 có hình</span>':''}${figNeed?'<span class="chip bad">cần cắt lại hình</span>':''}${err?`<span class="chip bad">${esc(err)}</span>`:''}<span style="margin-left:auto" class="row"><button class="btn ghost sm" data-crop="${i}" title="Cắt lại hình cho đề bài từ trang đề">✂️ Hình đề</button><button class="btn ghost sm" data-scrop="${i}" title="Cắt lại hình cho lời giải từ file hướng dẫn giải">✂️ Hình lời giải</button><button class="btn ghost sm" data-edd="${i}">Sửa</button><button class="btn danger sm" data-rmd="${i}" title="Xóa câu này khỏi danh sách duyệt">✕</button></span></div>${previewHtml(d.q,true)}</div>`; }).join('')}`;
  typeset(out);
  $$('[data-on]').forEach(c=>c.onchange=()=>{ D[+c.dataset.on].on=c.checked; renderDrafts(); });
  $$('[data-rmd]').forEach(b=>b.onclick=()=>{ D.splice(+b.dataset.rmd,1); renderDrafts(); });
  $$('[data-dstar]').forEach(b=>b.onclick=()=>{ const q=D[+b.dataset.dstar].q; q.kho=qKho(q)==='chuan'?'on':'chuan'; const y=window.scrollY; renderDrafts(); window.scrollTo(0,y); });
  const allK=(to)=>{ let n=0; D.forEach(d=>{ if(d.on){ d.q.kho=to; n++; } }); try{ localStorage.setItem('v2p-ws-kho', to); }catch(e){} renderDrafts(); toast(`${n} câu đã chọn → ${KHO[to]}`); };
  $('#dAllCh').onclick=()=>allK('chuan'); $('#dAllOn').onclick=()=>allK('on');
  $$('[data-crop]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.crop; cropTool(D[i].q, ()=>renderDrafts(), 'q'); });
  $$('[data-scrop]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.scrop; cropTool(D[i].q, ()=>renderDrafts(), 's'); });
  $$('[data-edd]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.edd; const copy=JSON.parse(JSON.stringify(D[i].q));

  if (MODE==='workshop'){ $('#dSave').onclick=()=>exportDrafts(); return; }
  $('#dSave').onclick=async()=>{
    const pick=D.filter(d=>d.on).map(d=>d.q); if(!pick.length){ toast('Chưa chọn câu nào'); return; }
    const msg=$('#dMsg'); const bad=pick.map(q=>validateQ(cleanQ(q))).filter(Boolean); if(bad.length){ msg.innerHTML=`<span style="color:var(--bad)">Có ${bad.length} câu thiếu thông tin — hãy sửa hoặc bỏ chọn.</span>`; return; }
    $('#dSave').disabled=true; let ok=0;
    for (const q of pick){ try{ await saveQuestion(q); ok++; msg.textContent=`Đã lưu ${ok}/${pick.length}…`; }catch(e){ msg.textContent=`Lỗi ở câu ${ok+1}: ${errMsg(e)}`; $('#dSave').disabled=false; return; } }
    S.aiDrafts=S.aiDrafts.filter(d=>!d.on); toast(`Đã thêm ${ok} câu vào ngân hàng`); renderDrafts();
  };
}

    try{
      const opt={modelTier:'complex', signal:ctrl.signal, onText:({text:t})=>{ const p=$('#aiProg'); if(p) p.textContent=`AI đang phân tích… ${t.length.toLocaleString('vi-VN')} ký tự`; }};
      if (keys.length) opt.images=await Promise.all(keys.map(k=>dataUrlToBlob(PAGES[k].url)));
      const res=await S.sample(prompt, opt);
      const o=extractJsonObject(res.text);
      const slots=(o.slots||[]).filter(s=>TYPES[s.type]).map(s=>({type:s.type, topic:allTopics(topicGrade(s.topic)||12, S.subj).some(t=>t.key===s.topic)?s.topic:'', level:LEVELS[s.level]?s.level:'', no:String(s.no||''), note:String(s.note||'')}));
      if (!slots.length) throw {message:'Không nhận ra câu nào trong đề'};
      const tOrder={mcq:0,tf:1,short:2}; slots.sort((a,b)=>tOrder[a.type]-tOrder[b.type]);
      ASTATE.bp={ id:newId('bp'), subject:S.subj, src:'chuan', name:$('#bName').value.trim()||o.name||'Cấu trúc đề', minutes:+$('#bMin').value||+o.minutes||90, grade:+$('#bGrade').value, slots };
      progBox('');
    }catch(e){ progBox(`<div class="banner">${aiErrorHtml(e)}</div>`); }
    ASTATE.busy=false; renderBpResult();
  };
}
function renderBpResult(){
  const out=$('#aiOut'); if(!out) return; const bp=ASTATE.bp; if(!bp){ out.innerHTML=''; return; }
  const c={mcq:0,tf:0,short:0}; bp.slots.forEach(s=>c[s.type]++);
  out.innerHTML=`<div class="card"><div class="row between"><div><h2 style="margin:0">${esc(bp.name)}</h2><div class="small muted">${esc(SUBJECTS[bp.subject||'toan'].name)} · ${bp.slots.length} câu (TN ${c.mcq} · Đ/S ${c.tf} · TLN ${c.short}) · ${bp.minutes} phút</div></div><button class="btn" id="bpExp">Xuất JSON cấu trúc</button></div>
    <table class="tbl mt"><tr><th>#</th><th>Câu</th><th>Dạng</th><th>Chủ đề</th><th>Mức độ</th><th>Nội dung</th></tr>
    ${bp.slots.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.no)}</td><td>${TYPE_SHORT[s.type]}</td><td>${s.topic?esc(topicName(s.topic)):'<i class="muted">bất kỳ</i>'}</td><td>${s.level?LEVELS[s.level]:'<i class="muted">bất kỳ</i>'}</td><td class="small muted">${esc(s.note||'')}</td></tr>`).join('')}</table>
    <p class="hint">Có thể chỉnh lại từng dòng sau khi nhập vào trang V2P (mục Cấu trúc đề).</p></div>`;
  $('#bpExp').onclick=async()=>{ const data=JSON.stringify(bp); try{ await navigator.clipboard.writeText(data); toast('Đã sao chép JSON cấu trúc — dán vào V2P: Cấu trúc đề → Nhập JSON'); }catch(e){ openModal(`<h3>JSON cấu trúc đề</h3><textarea style="min-height:200px;font-family:monospace;font-size:12px">${esc(data)}</textarea><div class="row end mt"><button class="btn" onclick="closeModal()">Đóng</button></div>`); } };
}

init();
</script>
