<style>
:root{
  --bg:#f5f6fa; --card:#fff; --ink:#1a2233; --ink2:#465068; --muted:#6b7488; --line:#e2e6ee; --line2:#cfd5e1;
  --pri:#4b3fe0; --pri2:#3a2fc4; --pri-soft:#eeecff; --acc:#ffb926; --acc2:#f2a600; --acc-soft:#fff5dc; --acc-ink:#5a3d00;
  --good:#16794a; --good-soft:#e4f4eb; --bad:#b8322a; --bad-soft:#fcebea; --warn:#9a5b00; --warn-soft:#fff3dc;
  --r:12px; --sh:0 1px 2px rgba(20,30,60,.06),0 2px 8px rgba(20,30,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--acc);display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;white-space:nowrap}
.brand img{width:38px;height:38px;object-fit:contain}
.brand .nm{font-weight:700;color:var(--pri);font-size:18px;line-height:1.1;letter-spacing:.2px}
.brand .tg{color:var(--muted);font-size:11.5px;line-height:1.2}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--pri-soft);color:var(--pri);box-shadow:inset 0 -3px 0 var(--acc)}
nav .sep{width:1px;background:var(--line);margin:4px 6px}
#who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
main{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end}
.between{justify-content:space-between}
.mt{margin-top:16px}.mt2{margin-top:24px}.mb{margin-bottom:12px}
.btn{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:9px;padding:8px 16px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--pri2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{background:var(--bg)}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.btn.danger{background:#fff;color:var(--bad);border-color:#efc3c0}
.btn.lg{padding:12px 22px;font-size:16px}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#1d1650}
.btn.acc:hover{background:var(--acc2);border-color:var(--acc2)}
.kpi{border-top:3px solid var(--acc)}
h1{color:#1d1650}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(100deg,var(--pri) 0%,#6a5ff0 60%,#7d6ff5 100%);color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h1{color:#fff;margin:0}
.hero p{margin:2px 0 0;opacity:.92}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:var(--acc);opacity:.9}
.hero .hl{color:var(--acc);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pri);color:#fff}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line2);border-radius:8px;padding:7px 10px;background:#fff;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.pri{background:var(--pri-soft);border-color:#cdd8ff;color:var(--pri)}
.chip.good{background:var(--good-soft);border-color:#bfe3cf;color:var(--good)}
.chip.bad{background:var(--bad-soft);border-color:#f1c6c3;color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:#f2d9a8;color:var(--warn)}
.muted{color:var(--muted)}
.small{font-size:13px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:8px}
.topic{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.topic:hover{border-color:var(--line2)}
.topic.on{border-color:var(--pri);background:var(--pri-soft)}
.topic input{margin-top:4px}
.topic .nm{font-weight:600;font-size:14px}
.topic .ct{font-size:12px;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;text-align:left;width:100%}
.opt:hover{border-color:var(--line2)}
.opt .lt{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .lt{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .lt{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(max-width:700px){.opts{grid-template-columns:1fr}}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;scroll-margin-top:80px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qnum{font-weight:700;color:var(--pri)}
.stem{font-size:15.5px}
.stem img,.qimg{max-width:100%;max-height:320px;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block}
.tf{width:100%;border-collapse:collapse;margin-top:10px}
.tf td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:middle}
.tf td.st{width:100%}
.tfb{border:1.5px solid var(--line2);background:#fff;border-radius:8px;padding:4px 12px;cursor:pointer;font-weight:600;min-width:52px}
.tfb.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.tfb.right{background:var(--good);border-color:var(--good);color:#fff}
.tfb.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.tfb.miss{border-color:var(--good);color:var(--good)}
.short{max-width:220px;font-size:17px;font-weight:600;letter-spacing:1px}
.layout{display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static!important;order:-1}}
.side{position:sticky;top:72px}
.navgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.navgrid button{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:5px 0;font-size:13px;cursor:pointer;font-weight:600}
.navgrid button.done{background:var(--pri);color:#fff;border-color:var(--pri)}
.navgrid button.right{background:var(--good);color:#fff;border-color:var(--good)}
.navgrid button.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.navgrid button.part{background:var(--warn-soft);color:var(--warn);border-color:#f2d9a8}
.timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.timer.low{color:var(--bad)}
.parttitle{font-weight:700;font-size:16px;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.sol{margin-top:12px;border-left:3px solid var(--pri);background:#f8f9fd;padding:10px 14px;border-radius:0 8px 8px 0}
.sol.hidden{display:none}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(140px,280px) 1fr 92px;gap:10px;align-items:center;font-size:13.5px}
@media(max-width:700px){.bar{grid-template-columns:1fr 70px}.bar .track{grid-column:1/-1;order:3}}
.track{height:12px;background:#eef0f5;border-radius:6px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:0 4px 4px 0}
.fill.good{background:#2e9a62}.fill.warn{background:#d99a2b}.fill.bad{background:#d2554c}
.bar .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:8px}
table.tbl td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:#fafbfe}
.num{text-align:right;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.modal.hidden{display:none}
.modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal .box.wide{max-width:1050px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a2233;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.on{opacity:1}
.banner{background:var(--warn-soft);border:1px solid #f2d9a8;color:#6e4300;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:30px}
.big{font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.matrix td,.matrix th{padding:6px 8px;font-size:13px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.prev{border:1px dashed var(--line2);border-radius:10px;padding:14px;background:#fcfcfe}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line2);background:#fff;padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
svg.trend text{font-size:11px;fill:var(--muted)}
.weak{border-left:4px solid var(--bad)}
.passage{background:#fffaf0;border:1px solid #f2d9a8;border-left:4px solid var(--acc);border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:15px;line-height:1.65}
.passage .ptitle{font-weight:700;color:#7a5200;font-size:13px;margin-bottom:6px}
.ai-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;margin-bottom:12px}
.ai-card.off{opacity:.45}
</style>

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MATH_RE = /(\$\$[\s\S]*?\$\$|\$[^$]*?\$|\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\])/;
function rich(t){
  return String(t ?? '').split(MATH_RE).map((part,i) => i % 2 ? esc(part) : esc(part).replace(/\n/g,'<br>')).join('');
}
const r2 = x => Math.round(x*100)/100;
const r4 = x => Math.round(x*10000)/10000;

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),ms); }
function typeset(el){
  if (!el) return;
  if (window.MathJax && MathJax.typesetPromise && MathJax.startup && MathJax.startup.document) {
    try { MathJax.typesetClear([el]); } catch(e){}
    MathJax.typesetPromise([el]).catch(()=>{});
  } else window.__mjPending.push(el);
}
function allTopics(grade, subj){
  subj = subj || S.subj;
  const src = subj==='toan' ? (BASE_TOPICS[grade]||[]) : ((SUBJ_TOPICS[subj]||{})[grade]||[]);
  const base = src.map(([k,n])=>({key:k,name:n,grade,subject:subj}));
  const nm=s=>String(s||'').toLowerCase().normalize('NFC').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
  const baseNames=new Set(base.map(t=>nm(t.name)));
  return base.concat(S.customTopics.filter(t=>+t.grade===+grade && (t.subject||'toan')===subj && !baseNames.has(nm(t.name))));
}
function topicSubject(key){ const m=/^([a-z]+)\d{2}-/.exec(key||''); if (m && SUBJECTS[m[1]]) return m[1]; const c=S.customTopics.find(t=>t.key===key); return (c&&c.subject)||'toan'; }
function qSubject(q){ return (q && q.subject) || topicSubject(q && q.topic); }
function qKho(q){ return (q && q.kho)==='chuan' ? 'chuan' : 'on'; }
function srcOk(q, src){ src=src||'all'; return src==='all' || qKho(q)===src; }
function topicName(key){
  const sj=topicSubject(key);
  for (const g of [10,11,12]) { const t = allTopics(g, sj).find(x=>x.key===key); if (t) return t.name; }
  return key || '—';
}
function topicLabel(key){ const sj=topicSubject(key); return (sj==='toan'?'':SUBJECTS[sj].short+' · ')+topicName(key); }
function topicGrade(key){ const m=/^(?:[a-z]+)?(\d{2})-/.exec(key||''); if(m) return +m[1]; const c=S.customTopics.find(t=>t.key===key); return c? +c.grade : null; }
function setSubject(sj){ if(!SUBJECTS[sj]) return; S.subj=sj; try{ localStorage.setItem('v2p-subj', sj); }catch(e){} S.setup.topics=[]; persistSetup(); }
function accClass(a){ return a>=0.8?'good':a>=0.5?'warn':'bad'; }
function accLabel(a){ return a>=0.8?'Vững':a>=0.5?'Cần luyện thêm':'Yếu'; }
function errMsg(e){
  const c = e && e.code;
  if (c==='quota_exceeded') return 'Cơ sở dữ liệu đã đầy: ' + (e.message||'');
  if (c==='resource_exhausted') return 'Thao tác quá nhanh, vui lòng thử lại sau vài giây.';
  if (c==='invalid_argument') return 'Bạn chưa có quyền ghi dữ liệu (cần quyền Contributor trở lên).';
  if (c==='revoked') return 'Quyền truy cập đã thay đổi. Hãy tải lại trang.';
  if (c==='permission-denied') return 'Bạn không có quyền thực hiện thao tác này (hãy kiểm tra đã đăng nhập, hoặc tài khoản giáo viên đã được thêm vào admins).';
  if (c==='resource-exhausted') return 'Đã vượt hạn mức miễn phí của Firebase hôm nay hoặc thao tác quá nhanh.';
  if (c==='unauthenticated') return 'Phiên đăng nhập đã hết, hãy đăng nhập lại.';
  return (e && e.message) || 'Có lỗi xảy ra.';
}
async function withRetry(fn){
  try { return await fn(); }
  catch(e){ if (e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); return await fn(); } throw e; }
}

async function go(route, force){
  if (S.quiz && !S.quiz.done && !force) {

  }

}

async function init(){
  if (MODE==='github') return initGithub();
  if (MODE==='workshop') return initWorkshop();
  const timeout = setTimeout(()=>{ if(!S.ready) $('#app').innerHTML = '<div class="banner">Chưa kết nối được tới dữ liệu. Hãy kiểm tra mạng, đăng nhập claude.ai và mở lại trang.</div>'; }, 10000);
  if (!window.claude || !window.claude.use) { clearTimeout(timeout); $('#app').innerHTML='<div class="banner">Trang này cần được mở trên claude.ai (đã đăng nhập) để lưu điểm và tải ngân hàng câu hỏi.</div>'; return; }
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  S.db = db; S.user = user;
  if (!db) { clearTimeout(timeout); $('#app').innerHTML='<div class="banner">Bạn cần đăng nhập claude.ai và được giáo viên chia sẻ trang này để sử dụng.</div>'; return; }
  try { S.isTeacher = !!(user && await user.canEdit()); } catch(e){ S.isTeacher=false; }
  try { S.uid = user ? await user.id() : null; } catch(e){ S.uid=null; }
  try {
    const cfg = await withRetry(()=>db.doc('config/topics').get());
    if (cfg.exists) S.customTopics = (cfg.data().list||[]).map(t=>({...t}));
  } catch(e){}
  if (S.uid) {
    try { const d = await withRetry(()=>db.doc('students/'+S.uid).get()); S.me = d.exists ? JSON.parse(JSON.stringify(d.data())) : null; } catch(e){ S.me=null; }
  }
  await loadBlueprints();
  S.ready = true; clearTimeout(timeout);
  const start = location.hash.slice(1);
  await go(ROUTES[start] ? start : (S.isTeacher ? 'lop-hoc' : 'luyen-tap'), true);
  if (!S.isTeacher && S.uid && (!S.me || !S.me.name)) profileModal(true);
}

async function loadBank(grade, force){
  if (S.bank[grade] && !force) return S.bank[grade];
  if (!S.db) throw {message:'Chưa kết nối cơ sở dữ liệu'};
  if (MODE==='github'){
    // Bộ nhớ đệm trên máy học sinh: chỉ tải lại khi giáo viên đã thay đổi ngân hàng (tiết kiệm hạn mức miễn phí của Firebase)
    let ver=0; try{ const v=await withRetry(()=>S.db.doc('config/bankver').get()); ver=(v.exists && v.data()['g'+grade]) || 0; }catch(e){}
    if (!force && ver){ try{ const c=JSON.parse(localStorage.getItem('v2p-bank-'+grade)||'null'); if (c && c.ver===ver && Array.isArray(c.list)){ S.bank[grade]=c.list; return c.list; } }catch(e){} }
    const snap = await withRetry(()=>S.db.collection('bank').where('grade','==',+grade).get());
    S.bank[grade] = snap.docs.map(d=>({...d.data(), id:d.id}));
    if (ver){ try{ localStorage.setItem('v2p-bank-'+grade, JSON.stringify({ver, list:S.bank[grade]})); }catch(e){ try{ localStorage.removeItem('v2p-bank-'+grade); }catch(_){} } }
    return S.bank[grade];
  }
  const out=[]; let last='';
  for (let guard=0; guard<40; guard++){
    let q = S.db.collection('bank').where('grade','==',+grade);
    if (last) q = q.where('k','>',last);
    const snap = await withRetry(()=>q.orderBy('k').limit(500).get());
    snap.docs.forEach(d=>{ const x=d.data(); out.push({...JSON.parse(JSON.stringify(x)), id:d.id}); });
    if (snap.size < 500) break;
    last = snap.docs[snap.docs.length-1].data().k;
  }
  S.bank[grade]=out;
  return out;
}
// Bỏ ghi chú nguồn đề ở đầu/cuối câu: (Sở GD&ĐT …), [THPT Chuyên … – Lần 1], (Đề thi thử TN THPT 2025) …
const SRC_KW='Sở|SGD|S\\.?GD|GD\\s*(?:&|và|-)?\\s*ĐT|GDĐT|BGD|Bộ\\s*GD|Bộ\\s*Giáo\\s*dục|Đề\\s*thi|Đề\\s*minh\\s*h[oọ]a|Đề\\s*tham\\s*khảo|Đề\\s*KS|khảo\\s*sát|thi\\s*thử|THPT|Chuyên|Trường|Liên\\s*trường|Cụm|Mã\\s*đề|Lần\\s*\\d|HK\\s*[12I]|học\\s*kì|học\\s*kỳ|giữa\\s*kì|cuối\\s*kì|TN\\s*THPT|THPTQG|Sưu\\s*tầm|Nguồn';
const SRC_TAG=`[\\(\\[]([^()\\[\\]\\n]{0,160}?(?:${SRC_KW})[^()\\[\\]\\n]{0,160}?)[\\)\\]]`;
const SRC_KW_LEAD=SRC_KW+'|(?:19|20)\\d\\d|KNTT|CTST|\\bCD\\s*\\d*\\b|\\bNK\\b|SGK|SBT|Mã\\s*\\d';
const SRC_LEAD=new RegExp(`^\\s*(?:Câu\\s*\\d+\\s*[.:]?\\s*)?[\\(\\[]([^()\\[\\]\\n$]{0,160}?(?:${SRC_KW_LEAD})[^()\\[\\]\\n$]{0,160}?)[\\)\\]]\\s*[.:\\-–]?\\s*`,'i');
const SRC_TAIL=new RegExp(`\\s*${SRC_TAG}\\s*[.]?\\s*$`,'i');
function stripSrc(s){ if(!s) return s; let t=String(s), prev; do{ prev=t; t=t.replace(SRC_LEAD,''); t=t.replace(SRC_TAIL,''); }while(t!==prev); return t.trim(); }
function cleanQ(q){
  const o = { type:q.type, grade:+q.grade, topic:q.topic, level:q.level||'TH', stem:stripSrc(String(q.stem||'').trim()), solution:String(q.solution||'').trim(), src:q.src||'manual' };
  if (q.type==='mcq'){ o.options=(q.options||[]).slice(0,4).map(s=>String(s??'').trim()); o.answer=+q.answer; }
  else if (q.type==='tf'){ o.statements=(q.statements||[]).slice(0,4).map(s=>String(s??'').trim()); o.answer=(q.answer||[]).slice(0,4).map(v=>v===true||v==='true'||v==='Đ'||v===1); }
  else { o.answer=String(q.answer??'').trim(); }
  if (q.img) o.img=q.img;
  if (q.solImg) o.solImg=q.solImg;
  o.subject = SUBJECTS[q.subject] ? q.subject : topicSubject(q.topic);
  o.kho = q.kho==='chuan' ? 'chuan' : 'on';
  if (q.passage && String(q.passage).trim()){ o.passage=String(q.passage).trim(); o.gid = q.gid || ('p'+hashStr(normPassage(o.passage))); if (q.gi!==undefined) o.gi=+q.gi||0; }
  if (q.createdAt) o.createdAt=q.createdAt;
  return o;
}
function hashStr(s){ let h1=0x811c9dc5; for (let i=0;i<s.length;i++){ h1^=s.charCodeAt(i); h1=Math.imul(h1,16777619); } return (h1>>>0).toString(36); }
function normPassage(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim().slice(0,600); }
function validateQ(q){
  if (!TYPES[q.type]) return 'Dạng câu hỏi không hợp lệ';
  if (![10,11,12].includes(+q.grade)) return 'Lớp phải là 10, 11 hoặc 12';
  if (q.topic && topicGrade(q.topic) && topicGrade(q.topic)!==+q.grade) return 'Chủ đề không thuộc lớp '+q.grade;
  if (!q.topic) return 'Chưa chọn chủ đề';
  if (!q.stem) return 'Đề bài đang trống';
  if (q.type==='mcq'){ if (!q.options || q.options.length!==4 || q.options.some(x=>!x)) return 'Cần đủ 4 phương án'; if (!(q.answer>=0&&q.answer<=3)) return 'Chưa chọn đáp án đúng'; }
  if (q.type==='tf'){ if (!q.statements || q.statements.length!==4 || q.statements.some(x=>!x)) return 'Cần đủ 4 mệnh đề a, b, c, d'; if (!Array.isArray(q.answer)||q.answer.length!==4) return 'Thiếu đáp án Đ/S'; }
  if (q.type==='short' && !q.answer) return 'Chưa có đáp số';
  return null;
}

async function saveQuestion(q){
  const id = q.id || newId();
  const data = cleanQ(q);
  if (!canEditSubj(data.subject)) throw {message:`Thầy/cô chỉ được thêm/sửa câu hỏi môn ${subjListText(S.teachSubj)}.`};
  const err = validateQ(data); if (err) throw {message:err};
  data.k = id; data.updatedAt = Date.now(); if (!data.createdAt) data.createdAt = Date.now();
  if (MODE==='github'){
    // Hình vẽ lưu ở tài liệu riêng bankimg/{id} để ngân hàng câu hỏi tải nhanh
    const imgQ=data.img||'', imgS=data.solImg||'';
    delete data.img; delete data.solImg;
    data.hasImg=!!imgQ; data.hasSolImg=!!imgS;
    if (imgQ||imgS) await withRetry(()=>S.db.doc('bankimg/'+id).set({q:imgQ, s:imgS}));
    else if (q.id && (q.hasImg||q.hasSolImg)) { try{ await S.db.doc('bankimg/'+id).delete(); }catch(e){} }
    S.imgCache[id]={q:imgQ, s:imgS};
  }
  await withRetry(()=>S.db.doc('bank/'+id).set(data));
  const oldG = Object.keys(S.bank).filter(g=>S.bank[g].some(x=>x.id===id)).map(Number);
  await bumpBank([data.grade, ...oldG]);
  for (const g of Object.keys(S.bank)) S.bank[g] = S.bank[g].filter(x=>x.id!==id);
  if (S.bank[data.grade]) S.bank[data.grade].push({...data, id});
  return id;
}

function persistSetup(){ try{ localStorage.setItem('onthi-setup', JSON.stringify(S.setup)); }catch(e){} }

function topicAcc(key){ const t=S.me&&S.me.stats&&S.me.stats.topics&&S.me.stats.topics[key]; return t&&t.n? t.s/t.n : null; }
function weightOf(q, adaptive){
  if (!adaptive) return 1;
  let w=1;
  const h = S.me && S.me.qh && S.me.qh[q.id];
  if (!h) w += 1.5; else { const a=h[1]/h[0]; w += 3*(1-a); if (a>=1) w *= 0.35; }
  const ta = topicAcc(q.topic); if (ta!==null) w += 2*(1-ta);
  return w;
}
function unitsOf(pool){ // gom các câu dùng chung một đoạn văn thành một "cụm"
  const byG={}, units=[];
  pool.forEach(q=>{ if (q.gid){ (byG[q.gid]=byG[q.gid]||[]).push(q); } else units.push([q]); });
  Object.values(byG).forEach(g=>units.push(g.sort((a,b)=>(a.gi||0)-(b.gi||0))));
  return units;
}
function pick(pool, n, adaptive){
  const groups={}; unitsOf(pool).forEach(u=>{ const k=u[0].topic; (groups[k]=groups[k]||[]).push(u); });
  let keys = shuffle(Object.keys(groups));
  if (adaptive) keys = keys.map(k=>({k, s:(topicAcc(k)??0.6) - Math.random()*0.25})).sort((a,b)=>a.s-b.s).map(x=>x.k);
  const uw=u=>u.reduce((a,q)=>a+weightOf(q,adaptive),0)/u.length;
  for (const k of keys) groups[k] = groups[k].map(u=>({u, key:Math.pow(Math.random(), 1/uw(u))})).sort((a,b)=>b.key-a.key).map(x=>x.u);
  const res=[];
  while (res.length<n){ let added=false; for (const k of keys){ if (res.length>=n) break; if (groups[k].length){ const u=groups[k].shift(); if (u.length>1 && res.length+u.length>n+Math.ceil(u.length/2) && groups[k].some(x=>x.length===1)) { groups[k].push(u); continue; } u.forEach(q=>res.push(q)); added=true; } } if(!added) break; }
  return res;
}
const LV_ORD={NB:0,TH:1,VD:2,VDC:3};
function sortByLevel(qs){ // dễ → khó, giữ các câu cùng đoạn văn đi liền nhau
  const gmin={}; qs.forEach(q=>{ if(q.gid){ const v=LV_ORD[q.level]??1; gmin[q.gid]=Math.min(gmin[q.gid]??9, v); } });
  return qs.map((q,i)=>({q,i,k:q.gid?gmin[q.gid]:(LV_ORD[q.level]??1)})).sort((a,b)=>a.k-b.k || (a.q.gid&&a.q.gid===b.q.gid ? (a.q.gi||0)-(b.q.gi||0) : a.i-b.i)).map(x=>x.q);
}
function buildItems(pl, w, adaptive=S.setup.adaptive, spec){
  const items=[];
  for (const t of ['mcq','tf','short']){
    const tp=pl.filter(q=>q.type===t); let got=[];
    if (spec && spec.mode==='so'){
      const cnt=(spec.cnt||{})[t]||{}; const used=new Set();
      for (const lv of ['NB','TH','VD','VDC']){ let need=+cnt[lv]||0; if(!need) continue;
        for (const alt of LV_FALLBACK[lv]){ if (need<=0) break; const r=pick(tp.filter(q=>q.level===alt && !used.has(q.id)), need, adaptive); r.forEach(q=>used.add(q.id)); got=got.concat(r); need-=r.length; } }
    } else {
      const L=spec && spec.lv && spec.lv[t]; const p2 = L && L.length ? tp.filter(q=>L.includes(q.level)) : tp;
      got=pick(p2, w[t]||0, adaptive);
    }
    sortByLevel(got).forEach(q=>items.push(mkItem(q)));
  }
  return items;
}
function mkItem(q){ return { q, perm: q.type==='mcq' ? shuffle([0,1,2,3]) : null }; }

  $$('#navgrid [data-go]').forEach(b=>b.onclick=()=>$('#q'+b.dataset.go).scrollIntoView({behavior:'smooth'}));
  $('#submit1').onclick=$('#submit2').onclick=()=>trySubmit();
  $('#quitQ').onclick=async()=>{ if(await ask('Hủy bài đang làm? Kết quả sẽ không được lưu.','Hủy bài','Tiếp tục làm')){ stopTimer(); S.quiz=null; go('luyen-tap',true);} };
  function updProg(){
    let n=0; Q.items.forEach((it,i)=>{ const done=isAnswered(it,Q.ans[i]); if(done)n++; const b=$(`#navgrid [data-go="${i}"]`); b.classList.toggle('done', done==='full'); b.classList.toggle('part', done==='part'); });
    $('#progress').textContent=`Đã làm ${n}/${Q.items.length} câu`;
  }
  updProg();
  const tick=()=>{
    const el=$('#timer'); if(!el){ stopTimer(); return; }
    if (Q.endAt){ const left=Math.max(0,Q.endAt-Date.now()); const m=Math.floor(left/60000), s=Math.floor(left%60000/1000); el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; el.classList.toggle('low', left<5*60000); if(left<=0){ stopTimer(); toast('Hết giờ! Bài làm được nộp tự động.'); submitQuiz(); } }
    else { const t=Date.now()-Q.start; const m=Math.floor(t/60000), s=Math.floor(t%60000/1000); el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
  };
  tick(); S.timerId=setInterval(tick,1000);
}
function isAnswered(it,a){
  if (it.q.type==='tf'){ const c=(a||[]).filter(v=>v!==null&&v!==undefined).length; return c===4?'full':c?'part':false; }
  if (it.q.type==='short') return a && String(a).trim() ? 'full' : false;
  return a!==undefined && a!==null ? 'full' : false;
}
async function trySubmit(){
  const Q=S.quiz; const miss=Q.items.filter((it,i)=>isAnswered(it,Q.ans[i])!=='full').length;
  const ok = await ask(miss?`Bạn còn <b>${miss}</b> câu chưa làm xong. Vẫn nộp bài?`:'Nộp bài và xem kết quả?', 'Nộp bài', 'Làm tiếp');
  if (ok) submitQuiz();
}
function normNum(s){ return String(s??'').trim().replace(/\s+/g,'').replace(',', '.'); }
function checkShort(given, answer){
  const g=normNum(given); if (!g) return false;
  const alts=String(answer??'').split('|').map(normNum).filter(Boolean);
  return alts.some(a=>{ const isN=x=>/^[-+]?(\d+\.?\d*|\.\d+)$/.test(x); if (isN(a)&&isN(g)) return Math.abs(parseFloat(a)-parseFloat(g))<1e-9; return a.toLowerCase()===g.toLowerCase(); });
}
function shortPts(q){ return SHORT_PTS[qSubject(q)] || 0.5; }
function gradeItem(q,a){
  if (q.type==='mcq'){ const ok=a===q.answer; return {f:ok?1:0, p:ok?0.25:0, mx:0.25}; }
  if (q.type==='tf'){ let k=0; for(let j=0;j<4;j++){ if(a&&a[j]!==null&&a[j]!==undefined&&a[j]===q.answer[j]) k++; } return {f:k/4, p:TF_POINTS[k], mx:1, k}; }
  const sp=shortPts(q); const ok=checkShort(a,q.answer); return {f:ok?1:0, p:ok?sp:0, mx:sp};
}
function snapQ(q){ const o={id:q.id,type:q.type,topic:q.topic,level:q.level,stem:q.stem,solution:q.solution,answer:q.answer}; if(q.options)o.options=q.options; if(q.statements)o.statements=q.statements; if(q.img||q.hasImg)o.hasImg=true; if(q.solImg||q.hasSolImg)o.hasSolImg=true; o.subject=qSubject(q); if(q.passage){ o.passage=q.passage; o.gid=q.gid; } return o; }
async function submitQuiz(){
  const Q=S.quiz; if (!Q || Q.done) return; Q.done=true; stopTimer();
  let pts=0, mx=0; const parts={mcq:[0,0],tf:[0,0],short:[0,0]};
  const items = Q.items.map((it,i)=>{ const a=Q.ans[i]===undefined?null:Q.ans[i]; const g=gradeItem(it.q,a); pts+=g.p; mx+=g.mx; parts[it.q.type][0]+=g.p; parts[it.q.type][1]+=g.mx;
    return { q:it.q.id, t:it.q.type, tp:it.q.topic, lv:it.q.level, a, f:r4(g.f), p:g.p, mx:g.mx, perm:it.perm, s:snapQ(it.q) }; });
  Object.keys(parts).forEach(k=>parts[k]=[r2(parts[k][0]),r2(parts[k][1])]);
  const att = { at:Date.now(), grade:Q.cfg.grade, subject:Q.cfg.subject||S.subj, kho:Q.cfg.src||'all', topics:Q.cfg.topics, name:Q.cfg.name, minutes:Q.cfg.minutes||0, dur:Math.round((Date.now()-Q.start)/1000), pts:r2(pts), max:r2(mx), score10: mx? r2(pts/mx*10) : 0, parts, items };
  vResult(att, false);
  if (!S.uid){ toast('Không lưu được điểm: bạn chưa đăng nhập.'); return; }
  try {
    const aid = newId('a');
    const attStore = {...att, items: att.items.map(x=>({...x}))};
    await withRetry(()=>S.db.doc(`students/${S.uid}/attempts/${aid}`).set(attStore));
    await saveMe(d=>mergeStats(d, att));
    const el=$('#saveState'); if (el) el.innerHTML='<span class="chip good">✓ Đã lưu kết quả</span>';
  } catch(e){ const el=$('#saveState'); if (el) el.innerHTML=`<span class="chip bad">Chưa lưu được: ${esc(errMsg(e))}</span>`; }
}
function mergeStats(d, att){
  d.stats = d.stats || {}; ['topics','types','levels'].forEach(k=>{ d.stats[k]=d.stats[k]||{}; });
  d.qh = d.qh || {};
  for (const it of att.items){
    for (const [b,key] of [['topics',it.tp],['types',it.t],['levels',it.lv]]){ if(!key) continue; const o=d.stats[b][key]||(d.stats[b][key]={n:0,s:0}); o.n++; o.s=r4(o.s+it.f); }
    const h=d.qh[it.q]||[0,0]; d.qh[it.q]=[h[0]+1, r4(h[1]+it.f)]; // [số lần, tổng đúng] – mảng số, không lồng
  }
  d.n=(d.n||0)+1; d.sum10=r2((d.sum10||0)+att.score10); d.last10=att.score10; d.best10=Math.max(d.best10||0, att.score10); d.lastAt=att.at;
  d.recent=[...(d.recent||[]).map(r=>Array.isArray(r)?{t:r[0],s:r[1]}:r), {t:att.at, s:att.score10}].slice(-40); // Firestore không cho mảng lồng mảng
  if (att.subject){ d.bySubj=d.bySubj||{}; const b=d.bySubj[att.subject]||(d.bySubj[att.subject]={n:0,sum10:0}); b.n++; b.sum10=r2(b.sum10+att.score10); }
}

/* ===================== Kết quả & xem lại ===================== */
function vResult(att, isReview, backFn){

  <div class="grid g2">

      <div class="row" style="align-items:flex-end;gap:14px;margin-top:8px"><div class="big" style="color:${sc>=8?'var(--good)':sc>=5?'var(--warn)':'var(--bad)'}">${fmt10(sc)}</div><div class="muted" style="padding-bottom:6px">/ 10 điểm<br>${fmt10(att.pts)}/${fmt10(att.max)} điểm thô · ${Math.floor(att.dur/60)} phút ${att.dur%60} giây</div></div>
      <table class="tbl mt"><tr><th>Phần</th><th class="num">Điểm</th></tr>
        ${['mcq','tf','short'].filter(k=>att.parts[k][1]).map(k=>`<tr><td>${TYPES[k]}</td><td class="num">${fmt10(att.parts[k][0])} / ${fmt10(att.parts[k][1])}</td></tr>`).join('')}
      </table>
      <div class="row mt" id="saveState">${isReview?'':'<span class="muted small"><span class="spin"></span> Đang lưu kết quả…</span>'}</div>
    </div>
    <div class="card"><h2>Kết quả theo chủ đề</h2><div class="bars">
      ${Object.entries(byTopic).sort((a,b)=>a[1].s/a[1].n-b[1].s/b[1].n).map(([k,o])=>barRow(topicLabel(k), o.s/o.n, `${o.n} câu`)).join('')}
    </div>
    <div class="row mt">${wrong?'<button class="btn" id="redoWrong">Làm lại các câu sai</button>':''}${isReview?'':'<button class="btn ghost" id="again">Tạo đề mới cùng cấu hình</button>'}</div></div>
  </div>
  <div class="row between mt2 mb"><h2 style="margin:0">Xem lại bài làm</h2>
    <div class="tabs" id="rvTabs" style="margin:0"><button data-f="all" class="on">Tất cả (${att.items.length})</button><button data-f="wrong">Chưa đúng (${wrong})</button><button data-f="right">Đúng (${att.items.length-wrong})</button></div>
    <button class="btn ghost sm" id="toggleSol">Mở tất cả lời giải</button></div>
  <div id="rvList">${att.items.map((it,i)=>reviewItem(it,i,att.items[i-1])).join('')}</div>`;
  typeset(app); hydrateImgs(app);
  if (backFn) $('#backBtn').onclick=backFn;
  $$('[data-sol]').forEach(b=>b.onclick=()=>{ const s=$('#sol'+b.dataset.sol); s.classList.toggle('hidden'); b.textContent=s.classList.contains('hidden')?'Xem lời giải chi tiết':'Ẩn lời giải'; });
  let allOpen=false;
  $('#toggleSol').onclick=()=>{ allOpen=!allOpen; $$('.sol').forEach(s=>s.classList.toggle('hidden',!allOpen)); $$('[data-sol]').forEach(b=>b.textContent=allOpen?'Ẩn lời giải':'Xem lời giải chi tiết'); $('#toggleSol').textContent=allOpen?'Thu gọn lời giải':'Mở tất cả lời giải'; };
  $$('#rvTabs button').forEach(b=>b.onclick=()=>{ $$('#rvTabs button').forEach(x=>x.classList.toggle('on',x===b)); const f=b.dataset.f; $$('#rvList .q').forEach(el=>{ const ok=el.dataset.ok==='1'; el.style.display = f==='all'||(f==='right'&&ok)||(f==='wrong'&&!ok)?'':'none'; }); });
  if ($('#again')) $('#again').onclick=()=>go('luyen-tap',true).then(()=>{});
  if ($('#redoWrong')) $('#redoWrong').onclick=async()=>{
    const grade=att.grade; let bank=[]; try{ bank=await loadBank(grade); }catch(e){}
    const items = att.items.filter(it=>it.f<1).map(it=>{ const live=bank.find(q=>q.id===it.q); return mkItem(live || {...it.s, grade}); });
    startQuiz({grade, subject:att.subject||qSubject(items[0]&&items[0].q), topics:[...new Set(items.map(x=>x.q.topic))], name:'Làm lại các câu sai', minutes:0}, items);

function liveImg(id){ for (const g in S.bank){ const q=S.bank[g].find(x=>x.id===id); if(q&&q.img) return q.img; } return null; }
function ansText(q,a){
  if (a===null||a===undefined||a==='') return '<i class="muted">(bỏ trống)</i>';
  if (q.type==='mcq') return 'ABCD'[a]??'?';
  if (q.type==='short') return esc(a);
  return '';
}
function reviewItem(it,i,prev){
  const q=it.s || {}; q.type=q.type||it.t;
  const psg = q.passage && (!prev || !prev.s || prev.s.gid!==q.gid) ? `<div class="passage"><div class="ptitle">Đoạn văn</div>${rich(q.passage)}</div>` : '';
  const ok=it.f>=1;
  const liveQ = q.hasImg && MODE!=='github' ? liveImg(it.q) : null;
  let body='';
  if (q.type==='mcq'){
    const perm=it.perm||[0,1,2,3];
    body=`<div class="opts">${perm.map((oi,j)=>{ const cls = oi===q.answer?'right':(oi===it.a?'wrong':''); return `<div class="opt ${cls}" style="cursor:default"><span class="lt">${'ABCD'[j]}</span><span>${rich(q.options[oi])}</span></div>`; }).join('')}</div>`;
    const yourLetter = it.a===null||it.a===undefined ? '<i class="muted">(bỏ trống)</i>' : 'ABCD'[perm.indexOf(it.a)];
    body+=`<div class="small mt">Bạn chọn: <b>${yourLetter}</b> · Đáp án đúng: <b>${'ABCD'[perm.indexOf(q.answer)]}</b></div>`;
  } else if (q.type==='tf'){
    body=`<table class="tf">${q.statements.map((s,j)=>{ const your=it.a?it.a[j]:null; const right=q.answer[j];
      const yb = your===null||your===undefined ? '<span class="muted small">bỏ trống</span>' : `<span class="tfb ${your===right?'right':'wrong'}" style="cursor:default">${your?'Đúng':'Sai'}</span>`;
      return `<tr><td><b>${'abcd'[j]})</b></td><td class="st">${rich(s)}</td><td style="white-space:nowrap">${yb} <span class="small muted">→ đáp án:</span> <b style="color:var(--good)">${right?'Đúng':'Sai'}</b></td></tr>`; }).join('')}</table>
      <div class="small mt">Đúng ${Math.round(it.f*4)}/4 ý → <b>${fmt10(it.p)}</b> điểm</div>`;
  } else {
    body=`<div class="small mt">Bạn trả lời: <b>${ansText(q,it.a)}</b> · Đáp số đúng: <b style="color:var(--good)">${esc(String(q.answer).split('|')[0])}</b></div>`;
  }
  const badge = ok?'<span class="chip good">✓ Đúng</span>':(it.f>0?'<span class="chip warn">Đúng một phần</span>':'<span class="chip bad">✗ Sai</span>');
  return `${psg}<div class="q" data-ok="${ok?1:0}"><div class="qhead"><span class="qnum">Câu ${i+1}.</span>${badge}<span class="chip">${esc(topicLabel(it.tp))}</span><span class="chip">${TYPE_SHORT[q.type]}</span><span class="chip">${LEVELS[it.lv]||''}</span><span class="small muted" style="margin-left:auto">${fmt10(it.p)}/${fmt10(it.mx)} đ</span></div>
    <div class="stem">${rich(q.stem)}</div>${liveQ?`<img class="qimg" src="${esc(liveQ)}" alt="">`:imgHtml(q,'q',it.q)}${body}
    <button class="btn ghost sm mt" data-sol="${i}">Xem lời giải chi tiết</button>
    <div class="sol hidden" id="sol${i}"><b>Lời giải.</b><br>${rich(q.solution||'(Chưa có lời giải)')}${imgHtml(q,'s',it.q)}</div></div>`;
}
function barRow(label, a, extra){
  return `<div class="bar" title="${esc(label)}: ${pct(a)} ${extra?'· '+esc(extra):''}"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</div><div class="track"><div class="fill ${accClass(a)}" style="width:${Math.max(2,a*100)}%"></div></div><div class="pct">${pct(a)} <span class="muted small" style="font-weight:400">${extra||''}</span></div></div>`;
}

/* ===================== Lịch sử ===================== */
async function vHistory(uid=S.uid, el=$('#app'), withTitle=true){
  if (withTitle) el.innerHTML=`<h1>Lịch sử làm bài</h1><p class="sub">Xem lại các bài đã làm, đáp án và lời giải.</p><div id="histBox"><div class="empty"><span class="spin"></span></div></div>`;
  else el.innerHTML='<div id="histBox"><div class="empty"><span class="spin"></span></div></div>';
  const box=$('#histBox', el);
  if (!uid){ box.innerHTML='<div class="empty">Bạn cần đăng nhập để lưu và xem lịch sử.</div>'; return; }
  try {
    const snap = await withRetry(()=>S.db.collection(`students/${uid}/attempts`).orderBy('at','desc').limit(60).get());
    const list = snap.docs.map(d=>({...JSON.parse(JSON.stringify(d.data())), id:d.id}));
    if (!list.length){ box.innerHTML='<div class="card empty">Chưa có bài làm nào.</div>'; return; }
    const canDel = MODE==='github' && S.isTeacher && S.isFull;
    const sel=new Set();
    box.innerHTML = `${canDel?`<div class="row mb" id="hDelBar" style="gap:8px;flex-wrap:wrap"><span class="small muted" id="hDelInfo">Tích ô ở đầu dòng để chọn bài làm thử / làm nhầm cần xóa. Xóa xong, số bài, điểm TB và điểm yếu được tính lại.</span><button class="btn danger sm" id="hDel" disabled>🗑 Xóa bài đã chọn</button></div>`:''}<div class="card" style="padding:6px 10px"><table class="tbl"><tr>${canDel?'<th></th>':''}<th>Thời gian</th><th>Đề</th><th>Chủ đề</th><th class="num">Số câu</th><th class="num">Điểm /10</th><th></th></tr>
      ${list.map((a,i)=>`<tr class="click" data-i="${i}">${canDel?`<td data-nc="1"><input type="checkbox" data-hs="${i}" style="width:18px;height:18px;cursor:pointer"></td>`:''}<td>${fmtDate(a.at)}</td><td>${esc(a.name||'')}<div class="muted small">Lớp ${a.grade}</div></td><td class="small">${(a.topics||[]).slice(0,3).map(t=>esc(topicName(t))).join('; ')}${(a.topics||[]).length>3?` (+${a.topics.length-3})`:''}</td><td class="num">${a.items.length}</td><td class="num"><b style="color:${a.score10>=8?'var(--good)':a.score10>=5?'var(--warn)':'var(--bad)'}">${fmt10(a.score10)}</b></td><td class="num"><button class="btn ghost sm">Xem lại</button></td></tr>`).join('')}</table></div>`;
    if (canDel){
      const upd=()=>{ $('#hDel',box).disabled=!sel.size; $('#hDel',box).textContent=sel.size?`🗑 Xóa ${sel.size} bài đã chọn`:'🗑 Xóa bài đã chọn'; };
      $$('[data-nc]', box).forEach(td=>td.onclick=e=>e.stopPropagation());
      $$('[data-hs]', box).forEach(c=>c.onchange=()=>{ c.checked?sel.add(+c.dataset.hs):sel.delete(+c.dataset.hs); c.closest('tr').style.background=c.checked?'#fff1f1':''; upd(); });
      $('#hDel',box).onclick=async()=>{
        const pick=[...sel].map(i=>list[i]);
        const desc=pick.slice(0,6).map(a=>`${fmtDate(a.at)} — ${esc(a.name||'')} (${fmt10(a.score10)} điểm)`).join('<br>')+(pick.length>6?`<br>… và ${pick.length-6} bài khác`:'');
        if (!await ask(`Xóa vĩnh viễn <b>${pick.length}</b> bài làm này?<br><br>${desc}<br><br>Các bài này sẽ không còn tính vào số bài, điểm trung bình và thống kê điểm yếu. Không khôi phục được.`,'Xóa bài')) return;
        const btn=$('#hDel',box); btn.disabled=true; btn.textContent='Đang xóa…';
        try{
          for (const a of pick) await withRetry(()=>S.db.doc(`students/${uid}/attempts/${a.id}`).delete());
          const d=await rebuildStats(uid); if (uid===S.uid) S.me=d;
          toast(`Đã xóa ${pick.length} bài và tính lại thống kê`);
          if (withTitle) vHistory(uid, el, true); else vStudentDetail(uid);
        }catch(e){ toast(errMsg(e)); btn.disabled=false; upd(); }
      };
    }
    $$('tr[data-i]', box).forEach(tr=>tr.onclick=async()=>{ const a=list[+tr.dataset.i]; try{ await loadBank(a.grade); }catch(e){} const back = withTitle ? ()=>go('lich-su',true) : ()=>vStudentDetail(uid); vResult(a, true, back); window.scrollTo(0,0); });
  } catch(e){ box.innerHTML=`<div class="banner">${esc(errMsg(e))}</div>`; }
}

/* ===================== Thống kê ===================== */
function statsHtml(d, own){
  if (!d || !d.n) return `<div class="card empty">${own?'Bạn chưa làm bài nào. Hãy vào <b>Luyện tập</b> để bắt đầu!':'Học sinh này chưa làm bài nào.'}</div>`;
  const st=d.stats||{topics:{},types:{},levels:{}};
  const tps=Object.entries(st.topics||{}).map(([k,o])=>({k,n:o.n,a:o.s/o.n})).sort((a,b)=>a.a-b.a);
  const weak=tps.filter(t=>t.n>=3&&t.a<0.7).slice(0,4);
  const avg=d.sum10/d.n;
  return `
  <div class="grid g4">
    <div class="card kpi"><div class="v">${d.n}</div><div class="l">Bài đã làm</div></div>
    <div class="card kpi"><div class="v">${fmt10(avg)}</div><div class="l">Điểm trung bình</div></div>
    <div class="card kpi"><div class="v">${fmt10(d.last10)}</div><div class="l">Bài gần nhất</div></div>
    <div class="card kpi"><div class="v">${fmt10(d.best10)}</div><div class="l">Cao nhất</div></div>
  </div>
  <div class="grid g2 mt">
    <div class="card"><h2>Tiến bộ điểm số</h2>${trendSvg(d.recent||[])}</div>
    <div class="card"><h2>Điểm yếu cần ôn ngay</h2>
      ${weak.length?weak.map(t=>`<div class="card weak" style="padding:10px 14px;margin-bottom:8px;box-shadow:none"><div class="row between"><b>${esc(topicLabel(t.k))}</b><span class="chip bad">${pct(t.a)} đúng</span></div><div class="small muted">Đã làm ${t.n} câu · Lớp ${topicGrade(t.k)||''}</div></div>`).join('')
        + (own?'<button class="btn mt" id="practiceWeak">Ôn ngay các chủ đề yếu →</button>':'')
        :'<p class="muted">Chưa phát hiện chủ đề yếu (cần làm ít nhất 3 câu mỗi chủ đề, tỉ lệ đúng dưới 70% mới được đánh dấu).</p>'}

function trendSvg(rec){
  if (rec.length<2) return '<p class="muted">Cần ít nhất 2 bài để vẽ biểu đồ.</p>';
  const W=520,H=190,pl=30,pr=10,pt=12,pb=24; const n=rec.length;
  const x=i=>pl+(W-pl-pr)*(n===1?0.5:i/(n-1)), y=v=>pt+(H-pt-pb)*(1-v/10);
  let g=''; for(const v of [0,5,10]){ g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e8ebf2"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }
  rec=rec.map(r=>Array.isArray(r)?r:[r.t,r.s]);
  const path=rec.map((r,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(r[1]).toFixed(1)}`).join(' ');
  const pts=rec.map((r,i)=>`<g><circle cx="${x(i)}" cy="${y(r[1])}" r="10" fill="transparent"><title>${fmtDate(r[0])}: ${fmt10(r[1])} điểm</title></circle><circle cx="${x(i)}" cy="${y(r[1])}" r="4" fill="#ffb926" stroke="#fff" stroke-width="2" pointer-events="none"/></g>`).join('');
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Điểm ${n} bài gần nhất">${g}<path d="${path}" fill="none" stroke="#4b3fe0" stroke-width="2"/>${pts}<text x="${pl}" y="${H-6}">Bài cũ</text><text x="${W-pr}" y="${H-6}" text-anchor="end">Gần nhất</text></svg><div class="hint">Rê chuột (hoặc chạm) vào điểm để xem chi tiết. ${n} bài gần nhất.</div>`;
}

async function doAccounts(act, ids){
  const A=ASTATE2; if(!ids.length) return;
  const ss=ids.map(id=>A.students.find(s=>s.id===id)).filter(Boolean);
  if (act==='delete'){
    const names=ss.slice(0,6).map(s=>esc(s.name||s.email||s.id)).join(', ')+(ss.length>6?` và ${ss.length-6} tài khoản khác`:'');
    if (!await ask(`Xóa <b>${ss.length}</b> tài khoản: ${names}?<br><br>Toàn bộ điểm, lịch sử làm bài và thống kê của các em sẽ bị <b>xóa vĩnh viễn, không khôi phục được</b>. (Nếu muốn giữ bảng điểm, hãy vào Lớp học → Sao chép bảng điểm trước.) Nếu các em đăng nhập lại sẽ phải chờ duyệt như tài khoản mới.`,'Xóa vĩnh viễn')) return;
  } else if (act==='lock'){
    if (!await ask(`Khóa ${ss.length} tài khoản? Các em sẽ không vào làm bài được cho đến khi thầy/cô mở khóa. Điểm và lịch sử vẫn được giữ.`,'Khóa')) return;
  }
  const box=$('#acBox'); let k=0; const tot=ss.length;
  const prog=()=>toast(`Đang xử lý ${k}/${tot}…`, 1200);
  try{
    for (const s of ss){
      const ref=S.db.doc('students/'+s.id);
      if (act==='approve') await withRetry(()=>ref.update({status:'active', approvedAt:Date.now()}));
      else if (act==='lock') await withRetry(()=>ref.update({status:'locked'}));
      else if (act==='delete'){
        for(;;){ const snap=await withRetry(()=>S.db.collection(`students/${s.id}/attempts`).limit(300).get()); if(!snap.size) break; const b=S.db.batch(); snap.docs.forEach(d=>b.delete(d.ref)); await withRetry(()=>b.commit()); }
        await withRetry(()=>ref.delete());
      }
      k++; if (k%5===0) prog();
    }
  }catch(e){ toast(`Dừng ở ${k}/${tot}: ${errMsg(e)}`, 6000); }
  A.sel.clear();
  toast(act==='approve'?`Đã duyệt ${k} tài khoản`:act==='lock'?`Đã khóa ${k} tài khoản`:`Đã xóa ${k} tài khoản`);
  vAccounts();
}

let BSTATE={grade:12, topic:'', type:'', level:'', q:'', page:0, kho:'', sel:new Set()};
async function setKho(qs, to, grade){
  let k=0; for (const q of qs){ if (qKho(q)===to) { k++; continue; } try{ await withRetry(()=>S.db.doc('bank/'+q.id).update({kho:to, updatedAt:Date.now()})); q.kho=to; q.updatedAt=Date.now(); k++; }catch(e){ toast(errMsg(e)); break; } }
  if (k) await bumpBank([grade]); return k;
}
async function vBank(){
  const app=$('#app');
  app.innerHTML=`<h1>Ngân hàng câu hỏi</h1><p class="sub">Thêm, sửa, xóa và phân loại câu hỏi theo chủ đề. Học sinh thấy câu mới ngay khi lưu.</p><div id="bBox"><div class="empty"><span class="spin"></span></div></div>`;
  try { await loadBank(BSTATE.grade, true); } catch(e){ $('#bBox').innerHTML=`<div class="banner">${esc(errMsg(e))}</div>`; return; }
  renderBank();
}

// Chuẩn hóa nội dung: bỏ dấu, bỏ khoảng trắng/ký hiệu LaTeX trình bày, chỉ giữ chữ và số
function normText(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d')
    .replace(/\\(dfrac|tfrac)/g,'\\frac').replace(/\\(left|right|displaystyle|limits|quad|qquad|text|mathrm)\b/g,' ')
    .replace(/\\[,;:! ]/g,' ').replace(/\{,\}/g,',').replace(/\[v2p\]/g,' ')
    .replace(/^\s*cau\s*\d+\s*[.:)]?/,'').replace(/[^a-z0-9]+/g,' ').trim();
}
function qSig(q){ return (q.passage?normText(q.passage).slice(0,300)+' ## ':'')+normText(q.stem)+' || '+(q.options||q.statements||[]).map(normText).join(' | '); }
function sigTokens(s){ const m=new Map(); s.split(' ').forEach(w=>{ if(w) m.set(w,(m.get(w)||0)+1); }); return m; }
function sigSim(a,b){ // Jaccard trên đa tập từ, có tính cả số → câu chỉ khác số liệu sẽ có độ giống thấp hơn
  const A=sigTokens(a), B=sigTokens(b); let inter=0, uni=0;
  new Set([...A.keys(),...B.keys()]).forEach(k=>{ const x=A.get(k)||0, y=B.get(k)||0; inter+=Math.min(x,y); uni+=Math.max(x,y); });
  return uni? inter/uni : 0;
}
const DUP_EXACT=0.999, DUP_NEAR=0.9;
function findDup(q, pool, skipId){
  const s=q._sig||qSig(q); let best=null, bs=0;
  for (const p of pool){
    if (!p || p===q || (skipId && p.id===skipId) || p.type!==q.type) continue;
    const ps=p._sig||(p._sig=qSig(p));
    if (ps===s) return {q:p, score:1};
    if (Math.abs(ps.length-s.length) > 0.25*Math.max(ps.length,s.length)) continue;
    const sc=sigSim(s,ps); if (sc>bs){ bs=sc; best=p; }
  }
  return bs>=DUP_NEAR ? {q:best, score:bs} : null;
}
async function allBank(){ const out=[]; for (const g of [10,11,12]){ try{ (await loadBank(g)).forEach(q=>out.push(q)); }catch(e){} } return out; }
function snip(s,n=160){ const t=String(s||'').replace(/\s+/g,' '); return t.length>n? t.slice(0,n)+'…' : t; }

// Nhập nhiều câu: kiểm tra trùng với ngân hàng và trùng trong chính lô nhập, cho giáo viên chọn cách xử lý
async function saveMany(arr, msgEl, btn){
  const bad=[]; arr.forEach((o,i)=>{ const e=validateQ(cleanQ(o)); if(e) bad.push(`Câu ${i+1}: ${e}`); });
  if (bad.length){ msgEl.innerHTML=`<span style="color:var(--bad)">${esc(bad.slice(0,3).join('; '))}${bad.length>3?'…':''}</span>`; return false; }
  msgEl.textContent='Đang kiểm tra câu trùng…';
  const bank=await allBank();
  const items=arr.map((o,i)=>{ const q={...o}; q._sig=qSig(q); return {i, q, dup:null, action:'add'}; });
  const seen=[];
  for (const it of items){
    let d=findDup(it.q, bank);
    if (d) it.dup={...d, where:'bank'};
    else { const d2=findDup(it.q, seen); if (d2) it.dup={...d2, where:'batch'}; }
    if (it.dup) it.action = it.dup.where==='batch' ? 'skip' : (it.dup.score>=DUP_EXACT ? 'skip' : 'add');
    seen.push(it.q);
  }
  const dups=items.filter(it=>it.dup);
  if (dups.length){
    const choice=await dupReview(items, dups);
    if (!choice) { msgEl.textContent='Đã hủy nhập.'; return false; }
  }
  if (btn) btn.disabled=true;
  let added=0, replaced=0, skipped=0, n=0; const todo=items.filter(it=>it.action!=='skip'); skipped=items.length-todo.length;
  for (const it of todo){
    const q={...it.q}; delete q._sig;
    try{
      if (it.action==='replace' && it.dup && it.dup.where==='bank'){
        const old=it.dup.q; q.id=old.id; q.createdAt=old.createdAt; q.hasImg=old.hasImg; q.hasSolImg=old.hasSolImg;
        if ((old.hasImg&&!q.img) || (old.hasSolImg&&!q.solImg)){ await loadImgs([old.id]); const c=S.imgCache[old.id]||{}; if(!q.img&&c.q) q.img=c.q; if(!q.solImg&&c.s) q.solImg=c.s; }
        await saveQuestion(q); replaced++;
      } else { delete q.id; await saveQuestion(q); added++; }

// Quét toàn bộ ngân hàng tìm câu trùng
async function scanDuplicates(){
  openModal('<div class="empty"><span class="spin"></span> Đang quét ngân hàng câu hỏi…</div>', true);
  const bank=await allBank(); bank.forEach(q=>{ q._sig=qSig(q); });
  const groups={}; bank.forEach(q=>{ const k=q.type+'|'+q.topic; (groups[k]=groups[k]||[]).push(q); });
  const exactMap={}; bank.forEach(q=>{ const k=q.type+'|'+q._sig; (exactMap[k]=exactMap[k]||[]).push(q); });
  const pairs=[]; const seenPair=new Set();
  Object.values(exactMap).forEach(list=>{ for(let i=1;i<list.length;i++){ pairs.push({a:list[0], b:list[i], score:1}); seenPair.add(list[0].id+'|'+list[i].id); } });
  Object.values(groups).forEach(list=>{ for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){ const a=list[i], b=list[j];
    if (seenPair.has(a.id+'|'+b.id)||seenPair.has(b.id+'|'+a.id)||a._sig===b._sig) continue;
    if (Math.abs(a._sig.length-b._sig.length) > 0.25*Math.max(a._sig.length,b._sig.length)) continue;
    const s=sigSim(a._sig,b._sig); if (s>=DUP_NEAR) pairs.push({a,b,score:s}); } });
  pairs.sort((x,y)=>y.score-x.score);
  const removed=new Set();
  const render=()=>{
    const live=pairs.filter(p=>!removed.has(p.a.id)&&!removed.has(p.b.id));
    $('#modalBox').innerHTML=`<div class="row between"><h2 style="margin:0">Câu hỏi trùng lặp trong ngân hàng</h2><button class="btn ghost sm" id="scClose">✕</button></div>
      <p class="small muted">Đã quét ${bank.length} câu. ${live.length?`Tìm thấy <b>${live.length}</b> cặp trùng hoặc gần giống (≥ 90%). Câu gần giống có thể chỉ khác số liệu — hãy xem kỹ trước khi xóa.`:'Không phát hiện câu trùng nào. 🎉'}</p>
      ${live.filter(p=>p.score>=DUP_EXACT).length?'<div class="row mb"><button class="btn danger sm" id="scAuto">Xóa tự động các bản trùng 100% (giữ câu cũ nhất)</button></div>':''}
      <div style="max-height:62vh;overflow:auto">${live.map((p,k)=>`<div class="card mb" style="box-shadow:none;padding:12px"><div class="row"><span class="chip ${p.score>=DUP_EXACT?'bad':'warn'}">${p.score>=DUP_EXACT?'Trùng 100%':'Giống '+Math.round(p.score*100)+'%'}</span><span class="chip">${TYPE_SHORT[p.a.type]}</span><span class="chip">${esc(topicName(p.a.topic))}</span></div>
        <div class="grid g2 mt small">${[p.a,p.b].map(q=>`<div><div class="prev" style="padding:8px">${rich(snip(q.stem,260))}</div><div class="row mt"><span class="muted">${q.createdAt?new Date(q.createdAt).toLocaleDateString('vi-VN'):''}${q.hasImg||q.img?' · có hình':''}${q.solution?'':' · chưa có lời giải'}</span><button class="btn danger sm" data-delq="${esc(q.id)}" style="margin-left:auto">Xóa câu này</button></div></div>`).join('')}</div></div>`).join('')}</div>`;
    typeset($('#modalBox'));
    $('#scClose').onclick=()=>{ closeModal(); if(S.view==='ngan-hang') renderBank(); };
    const del=async(id)=>{ await withRetry(()=>S.db.doc('bank/'+id).delete()); if(MODE==='github'){ try{ await S.db.doc('bankimg/'+id).delete(); }catch(_){} } removed.add(id); const q=bank.find(x=>x.id===id); for(const g in S.bank) S.bank[g]=S.bank[g].filter(x=>x.id!==id); return q; };
    $$('[data-delq]').forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ const q=await del(b.dataset.delq); await bumpBank([q&&q.grade]); toast('Đã xóa'); render(); }catch(e){ toast(errMsg(e)); b.disabled=false; } });
    if ($('#scAuto')) $('#scAuto').onclick=async()=>{
      const ex=live.filter(p=>p.score>=DUP_EXACT); if(!await askInline(`Xóa ${ex.length} câu trùng 100%? Mỗi cặp giữ lại câu được tạo trước.`)) return;
      const gs=new Set();
      for (const p of ex){ const drop=(p.a.createdAt||0)<=(p.b.createdAt||0)?p.b:p.a; if(removed.has(drop.id)) continue; try{ await del(drop.id); gs.add(drop.grade); }catch(e){} }
      await bumpBank([...gs]); toast('Đã xóa các câu trùng 100%'); render();
    };
  };
  render();
}
function askInline(msg){ return new Promise(r=>{ const box=document.createElement('div'); box.className='banner'; box.innerHTML=`${msg} <button class="btn danger sm" data-y>Xóa</button> <button class="btn ghost sm" data-n>Hủy</button>`; const host=$('#modalBox'); host.prepend(box); box.querySelector('[data-y]').onclick=()=>{ box.remove(); r(true); }; box.querySelector('[data-n]').onclick=()=>{ box.remove(); r(false); }; }); }

/* ===================== Cấu trúc đề (giáo viên khai báo) ===================== */
S.blueprints = [];
const LV_FALLBACK = { NB:['NB','TH','VD','VDC'], TH:['TH','NB','VD','VDC'], VD:['VD','TH','VDC','NB'], VDC:['VDC','VD','TH','NB'], '':[''] };
async function loadBlueprints(){
  if (!S.db) return;
  try { const d=await withRetry(()=>S.db.doc('config/blueprints').get()); S.blueprints = d.exists ? JSON.parse(JSON.stringify(d.data().list||[])) : []; } catch(e){}
}
async function saveBlueprints(list){
  await withRetry(()=>S.db.doc('config/blueprints').set({list, updatedAt:Date.now()}));
  S.blueprints = list;
}
function bpGrades(bp){ const g=new Set(bp.slots.map(s=>topicGrade(s.topic)).filter(Boolean)); if(!g.size||bp.slots.some(s=>!s.topic)) g.add(+bp.grade||12); return [...g]; }
function bpSubject(bp){ return SUBJECTS[bp.subject] ? bp.subject : 'toan'; }
function bpForSubj(){ return S.blueprints.filter(bp=>bpSubject(bp)===S.subj); }
function slotCandidates(all, s, used, bpGrade){
  const tOk=q=> s.topic ? q.topic===s.topic : (!bpGrade || +q.grade<=+bpGrade);
  for (const lv of (LV_FALLBACK[s.level||'']||[''])){
    const c=all.filter(q=>q.type===s.type && !used.has(q.id) && tOk(q) && (!lv || q.level===lv));
    if (c.length) return {c, exact: lv===(s.level||'')};
  }
  return {c:[], exact:false};
}
async function buildFromBlueprint(bp){
  const sj=bpSubject(bp), src=bp.src||'chuan';
  const grades=[...new Set([...bpGrades(bp), ...(bp.slots.some(s=>!s.topic)?[10,11,12].filter(g=>g<=(+bp.grade||12)):[])])];
  for (const g of grades) await loadBank(g);
  const allSubj=grades.flatMap(g=>(S.bank[g]||[]).filter(q=>qSubject(q)===sj && !s_topicFilter(q, bp)));
  const prim=allSubj.filter(q=>srcOk(q, src));            // ưu tiên kho đề chuẩn
  const used=new Set(); const items=[]; let missing=0, relaxed=0, fromOther=0, skip=0;
  const byGid={}; allSubj.forEach(q=>{ if(q.gid) (byGid[q.gid]=byGid[q.gid]||[]).push(q); });
  for (let si=0; si<bp.slots.length; si++){
    if (skip>0){ skip--; continue; }
    const s=bp.slots[si];
    let {c, exact}=slotCandidates(prim, s, used, bp.grade);
    if (!c.length && src!=='all'){ ({c, exact}=slotCandidates(allSubj, s, used, bp.grade)); if (c.length) fromOther++; }
    if (!c.length){ missing++; continue; }
    if (!exact) relaxed++;
    const pick=c.map(q=>({q,k:Math.pow(Math.random(),1/weightOf(q,S.setup.adaptive))})).sort((a,b)=>b.k-a.k)[0].q;
    if (pick.gid && byGid[pick.gid] && byGid[pick.gid].length>1){
      // câu dùng chung đoạn văn: lấy cả cụm, dùng thay cho các vị trí kế tiếp cùng dạng – chủ đề
      const grp=byGid[pick.gid].slice().sort((a,b)=>(a.gi||0)-(b.gi||0)).filter(q=>!used.has(q.id));
      grp.forEach(q=>{ used.add(q.id); items.push(mkItem(q)); });
      let k=si+1, extra=grp.length-1; while (extra>0 && k<bp.slots.length && bp.slots[k].type===s.type && bp.slots[k].topic===s.topic){ skip++; extra--; k++; }
    } else { used.add(pick.id); items.push(mkItem(pick)); }
  }
  const ord={mcq:0,tf:1,short:2}; items.sort((a,b)=>ord[a.q.type]-ord[b.q.type]);
  return {items, missing, relaxed, fromOther};
}
function s_topicFilter(q, bp){ return false; } // chỗ để lọc thêm sau này (ví dụ loại câu đã ẩn)
async function startBlueprint(bp){
  toast('Đang tạo đề theo cấu trúc…');
  try{
    const {items, missing, relaxed, fromOther}=await buildFromBlueprint(bp);
    if (!items.length){ toast('Ngân hàng chưa có câu hỏi phù hợp với cấu trúc này'); return; }
    startQuiz({grade:+bp.grade||12, subject:bpSubject(bp), src:bp.src||'chuan', topics:[...new Set(items.map(x=>x.q.topic))], name:bp.name, minutes:+bp.minutes||0, bp:bp.id}, items);
    if (fromOther && S.isTeacher) setTimeout(()=>toast(`${fromOther} vị trí thiếu câu trong kho đề chuẩn nên đã lấy từ kho ôn tập.`, 4500), 300);
    if (missing) setTimeout(()=>toast(`Lưu ý: còn ${missing} vị trí trong cấu trúc chưa có câu hỏi phù hợp nên đề có ${items.length}/${bp.slots.length} câu.`, 5000), 400);
    else if (relaxed && S.isTeacher) setTimeout(()=>toast(`${relaxed} câu được lấy ở mức độ gần nhất do thiếu câu đúng mức độ.`, 4000), 400);
  }catch(e){ toast(errMsg(e)); }
}

function newBp2025(){

function extractJsonArray(text){
  let t=String(text||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=t.indexOf('['), b=t.lastIndexOf(']');
  if (a<0||b<a) throw {message:'AI không trả về đúng định dạng JSON'};
  const arr=JSON.parse(t.slice(a,b+1));
  if (!Array.isArray(arr)) throw {message:'Kết quả không phải danh sách câu hỏi'};
  return arr;
}
function extractJsonObject(text){
  let t=String(text||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if (a<0||b<a) throw {message:'AI không trả về đúng định dạng JSON'};
  return JSON.parse(t.slice(a,b+1));
}

function addPage(url, label){ const k='p'+(++PAGE_SEQ); PAGES[k]={url,label}; return k; }
function dataUrlToBlob(url){ const [head,b64]=String(url).split(','); const mime=(/data:([^;]+)/.exec(head)||[])[1]||'image/jpeg'; const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return Promise.resolve(new Blob([arr],{type:mime})); }
function buildSolSegs(pages){
  let full='', marks=[];
  pages.forEach(pg=>{ marks.push([full.length, pg.p]); full+=pg.text+'\n'; });
  const scan=(re)=>{ const r=[]; let m; while((m=re.exec(full))) r.push({i:m.index+(m[0].length-m[0].trimStart().length), num:+m[1]}); return r; };
  let hits=scan(/(?:^|\n)[ \t]*C[âÂ]u\s*(\d{1,2})/g);           // "Câu n" ở đầu dòng
  if (hits.length<3) hits=scan(/C[âa]u\s*(\d{1,2})\s*[.:)\-]/gi); // dự phòng
  const pageAt=i=>{ let p=1; for(const [o,pp] of marks){ if(o<=i) p=pp; else break; } return p; };
  return hits.map((x,k)=>({num:x.num, page:pageAt(x.i), text:full.slice(x.i, k+1<hits.length?hits[k+1].i:full.length).slice(0,3500)}));
}
// Tìm phần lời giải nằm chung trong file đề
const SOL_HEAD = /(HƯỚNG\s*DẪN\s*GIẢI|HƯỚNG\s*DẪN\s*CHẤM|LỜI\s*GIẢI\s*CHI\s*TIẾT|LỜI\s*GIẢI\s*THAM\s*KHẢO|ĐÁP\s*ÁN\s*(?:VÀ|&|-)\s*(?:LỜI\s*GIẢI|HƯỚNG\s*DẪN)|ĐÁP\s*ÁN\s*CHI\s*TIẾT|PHẦN\s*LỜI\s*GIẢI|BẢNG\s*ĐÁP\s*ÁN)/;
async function detectCombined(doc){
  const N=Math.min(doc.numPages, 80), texts=[];
  for (let p=1;p<=N;p++){ try{ texts.push(String(await pageText(doc,p)).normalize('NFC')); }catch(e){ texts.push(''); } }
  let start=null, at=0;
  for (let p=2;p<=N;p++){ const m=SOL_HEAD.exec(texts[p-1]||''); if (m){ start=p; at=m.index; break; } }
  const inline=texts.reduce((a,t)=>a+((t.match(/(^|\n)\s*(Lời giải|Hướng dẫn giải|Giải)\s*[:.\n]/g)||[]).length),0);
  const ansPage=texts.findIndex((t,i)=>i>0 && /BẢNG\s*ĐÁP\s*ÁN/.test(t));
  return {start, mid: start ? at>250 : false, at, texts, inline, ansPage: ansPage>=0?ansPage+1:null};
}
function qNumbers(text){ const s=new Set(); const re=/C[âa]u\s*(\d{1,2})\b/gi; let m; while((m=re.exec(text))) s.add(+m[1]); return [...s]; }
function importPrompt(text, hasImg, extra){
  return `Bạn là ${subjRole()} ở Việt Nam. Dưới đây là nội dung một đề/bộ câu hỏi${hasImg?' (kèm ảnh — hãy đọc kỹ ảnh, ưu tiên ảnh khi văn bản bị lỗi font hoặc mất công thức)':''}.
Nhiệm vụ:
1. Tách từng câu hỏi riêng biệt.
2. Xác định dạng: "mcq" (có 4 phương án A-D), "tf" (có 4 ý a-d đúng/sai), "short" (trả lời ngắn/điền đáp số). Câu tự luận có đáp số là một số thì chuyển thành "short". Câu không thể chuyển (chứng minh, vẽ hình…) thì bỏ qua.
3. Phân loại lớp và chủ đề theo đúng danh sách mã sau:
${topicListText()}
4. Đánh giá mức độ NB/TH/VD/VDC.
5. Lời giải và đáp án: ƯU TIÊN TUYỆT ĐỐI lời giải / hướng dẫn giải / bảng đáp án có sẵn trong tài liệu (chép lại đúng cách giải của tác giả, xem QUY TẮC LỜI GIẢI). Chỉ tự giải những câu tài liệu không có lời giải.
6. BỎ phần ghi nguồn gốc câu hỏi (ví dụ "(Sở GD&ĐT Hà Nội 2024)", "[THPT Chuyên … – Lần 1]", "(Đề thi thử TN THPT …)", "Trích đề …") — không đưa vào "stem". Giữ nguyên phần còn lại của nội dung đề, chỉ chuẩn hóa công thức sang LaTeX${S.subj==='anh'?' (môn Tiếng Anh: không cần LaTeX)':''}. Bỏ phần đầu trang/chân trang, số trang, tên trường, mã đề.${subjNote()}
${extra||''}
${AI_SCHEMA}${hasImg?FIG_SCHEMA:'\nKhông có ảnh đính kèm: nếu câu cần hình vẽ thì mô tả hình bằng lời trong đề.'}

Nội dung đề:
"""
${text||'(xem ảnh đính kèm)'}
"""

Chỉ trả về MỘT mảng JSON (có thể rỗng [] nếu không có câu nào), không thêm bất kỳ chữ nào khác.`;
}
function parsePages(s, n){
  const out=new Set();
  String(s||'').split(/[,;\s]+/).forEach(p=>{ const m=/^(\d+)(?:-(\d+))?$/.exec(p.trim()); if(!m) return; const a=+m[1], b=m[2]?+m[2]:a; for(let i=Math.max(1,a);i<=Math.min(n,b);i++) out.add(i); });
  return [...out].sort((a,b)=>a-b);
}
/* ---- Đọc PDF bằng pdf.js (chạy trên luồng chính) ---- */
let PDFJS=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Không tải được thư viện đọc PDF. Kiểm tra mạng và thử lại.')); document.head.appendChild(s); }); }
async function getPdfJs(){
  if (PDFJS) return PDFJS;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if (!window.pdfjsLib) await loadScript(base+'pdf.min.js');
  if (!window.pdfjsWorker) await loadScript(base+'pdf.worker.min.js');
  PDFJS=window.pdfjsLib;
  if (!PDFJS) throw new Error('Không khởi động được thư viện đọc PDF.');
  try{ PDFJS.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'; }catch(e){}
  return PDFJS;
}
async function openPdf(file){
  const lib=await getPdfJs();
  const buf=await file.arrayBuffer();
  return await lib.getDocument({data:new Uint8Array(buf), isEvalSupported:false, useSystemFonts:true}).promise;
}
async function pageText(pdf,n){
  const p=await pdf.getPage(n); const tc=await p.getTextContent();
  let out='', lastY=null;
  for (const it of tc.items){ if(!('str' in it)) continue; const y=it.transform[5]; if(lastY!==null&&Math.abs(y-lastY)>3) out+='\n'; else if(out&&!/\s$/.test(out)) out+=' '; out+=it.str; lastY=y; if(it.hasEOL){ out+='\n'; lastY=null; } }
  return out.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
const PAGE_CACHE = new WeakMap();
async function pageKey(pdf, n, label){
  let m=PAGE_CACHE.get(pdf); if(!m){ m={}; PAGE_CACHE.set(pdf,m); }
  if (m[n] && PAGES[m[n]]) return m[n];
  const p=await pdf.getPage(n); const vp0=p.getViewport({scale:1}); const scale=Math.min(2.2,1500/vp0.width); const vp=p.getViewport({scale});
  const c=document.createElement('canvas'); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
  const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  await p.render({canvasContext:ctx, viewport:vp}).promise;
  m[n]=addPage(c.toDataURL('image/jpeg',0.85), label);
  return m[n];
}
function loadImage(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function cropFig(key, box, maxW=800, pad=12){
  const p=PAGES[key]; if(!p||!Array.isArray(box)||box.length!==4) return null;
  let [x1,y1,x2,y2]=box.map(Number); if([x1,y1,x2,y2].some(v=>!isFinite(v))) return null;
  if (Math.max(x1,y1,x2,y2)<=1.001){ x1*=1000; y1*=1000; x2*=1000; y2*=1000; } // AI trả về tỉ lệ 0-1
  if(x2<x1)[x1,x2]=[x2,x1]; if(y2<y1)[y1,y2]=[y2,y1];
  x1=Math.max(0,x1-pad); y1=Math.max(0,y1-pad); x2=Math.min(1000,x2+pad); y2=Math.min(1000,y2+pad);
  const img=await loadImage(p.url); const W=img.naturalWidth, H=img.naturalHeight;
  const sx=x1/1000*W, sy=y1/1000*H, sw=(x2-x1)/1000*W, sh=(y2-y1)/1000*H;
  if (sw<15||sh<15) return null;
  const sc=Math.min(1,maxW/sw); const c=document.createElement('canvas'); c.width=Math.round(sw*sc); c.height=Math.round(sh*sc);
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.85);
}
async function applyFigs(q, keys){
  q._pages=keys.slice();
  const one=async(f)=>{ if(!f||typeof f!=='object') return null; const k=keys[(+f.img||1)-1]; if(!k) return null; try{ return await cropFig(k, f.box); }catch(e){ return null; } };
  const qi=await one(q.fig); if(qi) q.img=qi;
  const si=await one(q.solFig); if(si) q.solImg=si;
  return q;
}
function fillPassages(list){
  // AI đôi khi chỉ ghi đoạn văn ở câu đầu cụm: chép xuống các câu sau có "gi" tăng dần
  let last=null;
  list.forEach(q=>{ if (q.passage && String(q.passage).trim()) last={p:q.passage, gi:+q.gi||1}; else if (last && +q.gi>last.gi){ q.passage=last.p; last.gi=+q.gi; } else last=null; });
  return list;
}
function normDraft(o, defaults){
  const q={...(defaults||{}), ...o, src:'ai'};
  if (q.stem) q.stem=stripSrc(q.stem);
  if (!q.kho){ try{ q.kho=localStorage.getItem('v2p-ws-kho')||'on'; }catch(e){ q.kho='on'; } }
  if(defaults){ q.grade=defaults.grade; q.topic=q.topic||defaults.topic; }
  q.grade=+q.grade||topicGrade(q.topic)||12;
  q.subject=(q.topic && topicSubject(q.topic)!=='toan') ? topicSubject(q.topic) : (S.subj||'toan');
  if (!q.passage) { delete q.passage; delete q.gi; }
  if(q.type==='short') q.answer=String(q.answer??'');
  return q;
}
function aiErrorHtml(e){
  if (e && e.code==='not_granted') return 'Trang chưa được phép dùng Claude. Hãy cho phép khi được hỏi và thử lại.';
  if (e && e.code==='rate_limited') return 'Đã gọi AI quá nhiều trong thời gian ngắn. Vui lòng đợi một lúc rồi thử lại.';
  if (e && (e.name==='AbortError'||e.code==='aborted')) return 'Đã dừng.';
  return `Lỗi: ${esc((e&&e.message)||'không rõ')}. Hãy thử lại hoặc giảm số câu/số trang.`;
}
function progBox(html){ const b=$('#aiProgBox'); if(b) b.innerHTML=html; }
async function runAI(prompt, images, defaults, pageKeys){
  if (ASTATE.busy) return; ASTATE.busy=true;
  const ctrl=new AbortController();
  progBox(`<div class="card"><span class="spin"></span> <span id="aiProg">AI đang soạn và tự kiểm tra lời giải… (có thể mất 1–3 phút)</span> <button class="btn ghost sm" id="aiStop" style="margin-left:10px">Dừng</button></div>`);
  $('#aiStop').onclick=()=>ctrl.abort();
  try{
    const opt={ modelTier:'complex', signal:ctrl.signal, onText:({text})=>{ const p=$('#aiProg'); if(p) p.textContent=`AI đang viết… ${text.length.toLocaleString('vi-VN')} ký tự`; } };
    if (images && images.length) opt.images=images;
    const res=await S.sample(prompt, opt);
    const {arr}=parseAiArray(res.text); if(!arr.length) throw {message:'AI không trả về câu hỏi nào (kết quả rỗng hoặc sai định dạng)'};
    const drafts=fillPassages(arr.filter(o=>o&&o.stem)).map(o=>normDraft(o,defaults));
    if (pageKeys && pageKeys.length) for (const q of drafts) await applyFigs(q, pageKeys);
    S.aiDrafts=(S.aiDrafts||[]).concat(drafts.map(q=>({q, on:true})));
    progBox('');
    toast(`AI đã soạn ${drafts.length} câu — hãy kiểm tra trước khi lưu`);
  }catch(e){ progBox(`<div class="banner">${aiErrorHtml(e)}</div>`); }
  ASTATE.busy=false;
  renderDrafts();
}
// Đọc các object JSON hoàn chỉnh từ một mảng có thể bị cắt cụt (khi AI viết quá dài)
function salvageJsonArray(text){
  const t=String(text||''); const start=t.indexOf('['); if(start<0) return [];
  const out=[]; let depth=0, inStr=false, esc=false, objStart=-1;
  for (let i=start+1;i<t.length;i++){
    const ch=t[i];
    if (inStr){ if(esc) esc=false; else if(ch==='\\') esc=true; else if(ch==='"') inStr=false; continue; }
    if (ch==='"'){ inStr=true; continue; }
    if (ch==='{'){ if(depth===0) objStart=i; depth++; }
    else if (ch==='}'){ depth--; if(depth===0&&objStart>=0){ try{ out.push(JSON.parse(t.slice(objStart,i+1))); }catch(e){} objStart=-1; } }
    else if (ch===']' && depth===0) break;
  }
  return out;
}
function parseAiArray(text){ try{ return {arr:extractJsonArray(text), partial:false}; }catch(e){ const arr=salvageJsonArray(text); return {arr, partial:true}; } }

async function runPdf(pdf, from, to, ansPages, withImg, sol, imgMax){
  if (ASTATE.busy) return; ASTATE.busy=true;
  const ctrl=new AbortController(); let stopped=false;
  const pages=[]; for(let i=from;i<=to;i++) if(!ansPages.includes(i)) pages.push(i);
  // Có ảnh: mỗi lượt 1 trang chính + ảnh trang kế tiếp (để lấy phần câu và hình vẽ bị tràn sang trang sau)
  // Không có ảnh: mỗi lượt 2 trang văn bản
  const chunks=[]; const step=withImg?1:2; for(let i=0;i<pages.length;i+=step) chunks.push(pages.slice(i,i+step));
  progBox(`<div class="card"><div class="row between"><div><span class="spin"></span> <span id="aiProg">Đang chuẩn bị…</span></div><button class="btn ghost sm" id="aiStop">Dừng</button></div><div class="track mt"><div class="fill good" id="aiBar" style="width:0%;background:var(--pri)"></div></div><div class="small muted mt" id="aiLog"></div></div>`);
  $('#aiStop').onclick=()=>{ stopped=true; ctrl.abort(); };
  const setProg=(t,p)=>{ const a=$('#aiProg'); if(a) a.textContent=t; const b=$('#aiBar'); if(b&&p!==undefined) b.style.width=Math.round(p*100)+'%'; };
  const log=(s)=>{ const l=$('#aiLog'); if(l) l.innerHTML+=s+'<br>'; };
  let ansText='';
  try{ for(const p of ansPages) ansText+=`--- Trang ${p} ---\n`+await pageText(pdf,p)+'\n'; }catch(e){}
  const maxImgs = withImg ? Math.max(2, imgMax||4) : 0;
  let added=0, withFig=0; const failed=[];
  for (let ci=0; ci<chunks.length && !stopped; ci++){
    const ch=chunks[ci]; const main=ch[0], last=ch[ch.length-1];
    const label = ch.length>1 ? `trang ${ch.join('–')}` : `trang ${main}`;
    setProg(`Lượt ${ci+1}/${chunks.length}: đang đọc ${label}…`, ci/chunks.length);
    try{
      let text=''; for(const p of ch) text+=`--- Trang đề ${p} ---\n`+await pageText(pdf,p)+'\n';
      const next=last+1; const hasNext = next<=pdf.numPages && !ansPages.includes(next) && !(sol && sol.sameDoc && next>=sol.start && !(next===sol.start && to>=sol.start));
      let nextText=''; if (hasNext) { try{ nextText=(await pageText(pdf,next)).slice(0,1800); }catch(e){} }
      let solText='', solPages=[], chSegs=[];
      if (sol && sol.segs.length){
        const nums=qNumbers(text + '\n' + nextText.slice(0,600));
        const segs=sol.segs.filter(s=>nums.includes(s.num));
        solText=segs.map(s=>`--- (trang HDG ${s.page}) ---\n${s.text}`).join('\n').slice(0,30000);
        solPages=[...new Set(segs.map(s=>s.page))].slice(0,2); chSegs=segs;
      }
      const keys=[], labels=[];
      if (maxImgs){
        for (const p of ch){ keys.push(await pageKey(pdf,p,'Trang đề '+p)); labels.push('trang đề '+p+' (trang chính)'); }
        if (hasNext && keys.length<maxImgs){ keys.push(await pageKey(pdf,next,'Trang đề '+next)); labels.push('trang đề '+next+' (trang kế tiếp, chỉ để lấy phần còn lại và hình vẽ của câu cuối)'); }
        if (sol) for (const p of solPages){ if(keys.length>=maxImgs) break; keys.push(await pageKey(sol.doc,p,'Trang HDG '+p)); labels.push('trang hướng dẫn giải '+p); }
      }
      const imgs = await Promise.all(keys.map(k=>dataUrlToBlob(PAGES[k].url)));
      const extra=(sol&&sol.sameDoc?`0. File này có cả đề và lời giải: phần lời giải bắt đầu ở trang ${sol.start}${ch.includes(sol.start)?' (ngay sau tiêu đề HƯỚNG DẪN GIẢI / LỜI GIẢI / ĐÁP ÁN trên trang này)':''}. Phần lời giải KHÔNG phải câu hỏi — không trích nó thành câu hỏi mới.\n`:'')+`7. CHỈ trích các câu hỏi BẮT ĐẦU trên ${label} (trang chính). BỎ QUA phần đầu trang chính nếu đó là phần cuối của một câu đã bắt đầu ở trang trước. Nếu câu cuối cùng của trang chính còn tiếp sang trang kế tiếp (phần đề, phương án, bảng hoặc HÌNH VẼ nằm ở trang sau) thì phải dùng trang kế tiếp để lấy trọn câu đó, nhưng KHÔNG trích các câu bắt đầu ở trang kế tiếp.
8. Đề có thể đánh số lại "Câu 1" ở mỗi phần (PHẦN I trắc nghiệm, PHẦN II đúng/sai, PHẦN III trả lời ngắn) — xác định dạng theo phần chứa câu.
9. Văn bản trích từ PDF bên dưới thường bị LỖI CÔNG THỨC (công thức MathType bị vỡ, mất phân số, căn, mũ). Luôn đọc đề và công thức từ ẢNH; văn bản chỉ để tham khảo chữ tiếng Việt. Bỏ qua chữ/logo in chìm (watermark) trên nền trang.
10. Lời giải viết ngắn gọn nhưng đủ các bước chính (khoảng 3–8 dòng mỗi câu) để không vượt giới hạn độ dài.
${keys.length?`Danh sách ảnh đính kèm theo thứ tự: ${labels.map((l,i)=>`Ảnh ${i+1} = ${l}`).join('; ')}. Tọa độ khung hình vẽ ("fig"/"solFig") tính theo đúng ảnh chứa hình đó.\n`:''}${!keys.length&&nextText?`Trang kế tiếp (chỉ để tham khảo phần còn lại của câu cuối):\n"""\n${nextText}\n"""\n`:''}${ansText?`Bảng đáp án của cả đề (đáp án chính thức — lấy "answer" theo bảng này, đối chiếu theo số thứ tự câu):\n"""\n${ansText.slice(0,4000)}\n"""\n`:''}${solText?`HƯỚNG DẪN GIẢI CHÍNH THỨC cho các câu trong phần này (ghép đúng câu theo nội dung, vì mỗi phần có thể đánh số lại từ Câu 1). Với mỗi câu có trong đây: "solution" = CHÉP LẠI đúng lời giải này (giữ nguyên cách giải và các bước, chỉ chuẩn hóa LaTeX), "answer" theo đáp án trong đây, "solSrc": "hdg". Nếu chữ bị lỗi font/mất công thức thì đọc lại từ ảnh trang hướng dẫn giải. Lấy hình vẽ lời giải từ ảnh trang hướng dẫn giải nếu có:\n"""\n${solText}\n"""\n`:''}`;
      const opt={ modelTier:'complex', signal:ctrl.signal, onText:({text:t})=>setProg(`Lượt ${ci+1}/${chunks.length} (${label}): AI đang viết… ${t.length.toLocaleString('vi-VN')} ký tự`) };
      if (imgs.length) opt.images=imgs;
      let got=[];
      let res=await S.sample(importPrompt(text, imgs.length>0, extra), opt);
      let {arr, partial}=parseAiArray(res.text); got=got.concat(arr);
      // Bị cắt cụt: hỏi tiếp phần còn lại (tối đa 2 lần)
      for (let k=0; k<2 && (partial || res.truncated) && !stopped; k++){
        setProg(`Lượt ${ci+1}/${chunks.length} (${label}): đang lấy tiếp các câu còn lại…`);
        const done=got.map((q,i)=>`${i+1}. ${String(q.stem||'').replace(/\s+/g,' ').slice(0,90)}`).join('\n');
        res=await S.sample(importPrompt(text, imgs.length>0, extra+`\nĐÃ TRÍCH XONG các câu sau, KHÔNG lặp lại:\n${done||'(chưa có)'}\nHãy trích TIẾP các câu còn lại bắt đầu trên ${label}. Nếu không còn câu nào thì trả về [].`), opt);
        ({arr, partial}=parseAiArray(res.text)); got=got.concat(arr);
        if (!arr.length) break;
      }
      const drafts=fillPassages(got.filter(o=>o&&o.stem)).map(o=>{ const q=normDraft(o,null); q.srcNote=label;
        q._qHint=[...ch, ...(hasNext?[next]:[])];
        if (chSegs.length){ const mine=chSegs.filter(s=>+s.num===+o.no).map(s=>s.page); const solHint=[...new Set([...mine, ...chSegs.map(s=>s.page)])]; if (solHint.length){ const lo=Math.min(...solHint), hi=Math.max(...solHint); for(let p=lo;p<=hi+1;p++) if(!solHint.includes(p)) solHint.push(p); } q._solHint=solHint.slice(0,8); } return q; });
      if (keys.length) for (const q of drafts){ await applyFigs(q, keys); if(q.img||q.solImg) withFig++; }
      S.aiDrafts=(S.aiDrafts||[]).concat(drafts.map(q=>({q,on:true})));
      added+=drafts.length;
      log(`✓ ${label}: ${drafts.length} câu${drafts.filter(q=>q.img).length?` (${drafts.filter(q=>q.img).length} câu có hình)`:''}`);
      renderDrafts();
    }catch(e){
      if (stopped || (e&&e.name==='AbortError')) break;
      if (e && (e.code==='not_granted'||e.code==='rate_limited')){ progBox(`<div class="banner">${aiErrorHtml(e)} Đã lấy được ${added} câu.</div>`); ASTATE.busy=false; renderDrafts(); return; }
      failed.push(label); log(`✗ ${label}: ${esc((e&&e.message)||'lỗi')}`);
    }
  }
  ASTATE.busy=false;
  progBox(`<div class="banner" style="background:var(--good-soft);border-color:#bfe3cf;color:var(--good)">${stopped?'Đã dừng. ':'Hoàn tất. '}AI đã tách được <b>${added}</b> câu${withFig?`, trong đó <b>${withFig}</b> câu có hình vẽ`:''}.${failed.length?` <span style="color:var(--bad)">Chưa xử lý được: ${failed.join(', ')} — có thể chạy lại riêng các trang này.</span>`:''} Hãy kiểm tra hình vẽ, đáp án bên dưới rồi lưu.</div>`);
  renderDrafts();
}
